<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resumen Final - Math Minds</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="styles.css">

  <!-- Registrar Service Worker lo antes posible para bloquear peticiones directas a /v1/transactions -->
  <script>
    if ('serviceWorker' in navigator) {
      try {
        navigator.serviceWorker.register('/sw-wompi-guard.js', { scope: '/' }).then(reg => {
          console.log('[wompi-sw] ServiceWorker registrado:', reg.scope);
        }).catch(err => console.warn('[wompi-sw] registro fallido:', err));
      } catch(e) {
        console.warn('[wompi-sw] registro error', e);
      }
    }
  </script>

  <!-- Using Widget Checkout Web only: do NOT load v1.js or call $wompi.initialize to avoid merchants/undefined. -->
  <!-- Service Worker proxies Wompi POSTs to the backend; no client-side fetch/XHR blocking here -->
    <!-- Service Worker proxies Wompi POSTs to the backend; no client-side fetch/XHR blocking here -->

  <!-- Widget será inyectado dinámicamente cuando tengamos firma; NO cargarlo globalmente aquí -->

  <style>
    :root {
      --black: #111;
      --purple: #13d6eba2;
      --light-gray: #f4f7f6;
    }

    body {
      background-color: var(--light-gray);
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
    }

    .header-mini {
      background: #fff;
      padding: 15px 40px;
      border-bottom: 2px solid var(--black);
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logo-mini { width: 80px; }

    .btn-back {
      text-decoration: none;
      color: var(--black);
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      padding: 8px 14px;
      border: 1.5px solid var(--black);
      border-radius: 10px;
      margin-left: auto;
    }

    .container-final {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 30px;
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 36px;
      box-shadow: 0 8px 20px rgba(17,17,17,0.06);
      border: 1px solid rgba(0,0,0,0.06);
    }

    h3 {
      margin-top: 0;
      text-transform: uppercase;
      font-size: 18px;
      border-bottom: 2px solid var(--purple);
      display: inline-block;
      margin-bottom: 28px;
    }

    .producto-row {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .producto-row img {
      width: 70px;
      height: 60px;
      object-fit: contain;
      background: #f9f9f9;
      border-radius: 10px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .input-estudiante {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid rgba(0,0,0,0.12);
      border-radius: 10px;
      font-size: 15px;
      margin-top: 8px;

    label {
      display: block;

    }

    .student-note {
      color: #b30000;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 28px;
      margin-top: 0;
      line-height: 1.6;
    }

    .acudiente-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 24px;
      align-items: start;
    }

    .acudiente-row { background: #f9f9f9; padding: 14px; border-radius: 8px; }

    .acudiente-label { display: block; font-size: 11px; color: #555; font-weight: 700; margin-bottom: 8px; }

    .acudiente-value { font-size: 14px; color: #111; line-height: 1.5; }

    .total-box {
      text-align: right;
      margin-top: 20px;
      font-size: 24px;
      font-weight: 900;
    }

    .domicilio-section {
      background: #f0f8ff;
      padding: 24px;
      border-radius: 10px;
      margin-top: 28px;
      margin-bottom: 28px;
      border: 1px solid #ccc;
      display: none;
    }

    .domicilio-section h4 {
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 16px;
    }

    .domicilio-section label {
      cursor: pointer;
      margin: 0;
      line-height: 1.5;
    }

    .domicilio-info {
      color: #666;
      font-size: 13px;
      margin-top: 12px;
      margin-bottom: 0;
      display: none;
    }

    @media (max-width: 850px) {
      .container-final { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

<header class="header-mini">
  <img src="../Multimedia/Logo.png" alt="Logo" class="logo-mini">
  <a href="pago.html" class="btn-back">← Regresar</a>
</header>

<div class="container-final">

  <div class="card">
    <h3>Resumen de Libros/Kits</h3>
    <div id="lista-productos"></div>
    <div id="total-precio" class="total-box">Cargando total...</div>
  </div>

  <div class="card">
    <h3>Datos del Acudiente</h3>
    <div class="acudiente-grid" id="acudiente-grid"></div>
  </div>

  <div class="card">
    <h3>Datos del Estudiante</h3>
    <p class="student-note">Por favor completa los datos del ESTUDIANTE que recibirá los productos:</p>

    <div class="form-group">
      <label>APELLIDO</label>
      <input id="studentLastName" class="input-estudiante">
    </div>

    <div class="form-group">
      <label>NOMBRE</label>
      <input id="studentFirstName" class="input-estudiante">
    </div>

    <div class="form-group">
      <label>GRADO</label>
      <input id="studentGrade" class="input-estudiante">
    </div>

    <div class="form-group">
      <label>DOCUMENTO</label>
      <input id="studentDoc" class="input-estudiante">
    </div>

    <div class="form-group">
      <label>CORREO ELECTRÓNICO</label>
      <input id="studentEmail" type="email" class="input-estudiante">
    </div>

    <!-- Sección de Domicilio -->
    <div id="domicilio-section" class="domicilio-section">
      <h4>Envío a Domicilio</h4>
      <div style="display: flex; align-items: flex-start; gap: 12px;">
        <input type="checkbox" id="solicitar-domicilio" style="width: 20px; height: 20px; cursor: pointer; margin-top: 2px; flex-shrink: 0;">
        <label for="solicitar-domicilio">¿Deseas que enviemos a domicilio? Se añadirán $13.000 al total.</label>
      </div>
      <p class="domicilio-info">Se añadirán $13.000 al total por envío a domicilio.</p>
    </div>

    <div id="campos-domicilio-confirmacion" style="display: none;">
      <div class="form-group">
        <label>CONFIRMAR DIRECCIÓN DE ENVÍO</label>
        <input id="studentAddress" class="input-estudiante">
      </div>

      <div class="form-group">
        <label>CONFIRMAR TELÉFONO</label>
        <input id="studentPhone" type="tel" class="input-estudiante">
      </div>
    </div>

    <!-- Pasarela de Pago -->
    <div id="wompi-widget-container" style="margin-top: 20px;"></div>
  </div>

</div>

<script>
/* ============================================
   CONFIG WOMPI + APPS SCRIPT (NO TOCAR EL DISEÑO)
============================================ */
// Usa la llave pública de prueba que proporcionaste
const WOMPI_PUBLIC_KEY = 'pub_test_B3FDnEk0nvEP7EUFzOEoRPl0N8HKGsgK';
const WOMPI_CURRENCY = 'COP';

/**
 * ⚠️ TU LLAVE NO ES pub_test_... así que NO se puede detectar.
 * Elige manualmente:
 * - 'test' si estás en sandbox y tu Apps Script tiene WOMPI_INTEGRITY_SECRET_TEST
 * - 'prod' si estás en producción y tu Apps Script tiene WOMPI_INTEGRITY_SECRET_PROD
 */
const WOMPI_ENV = 'test'; // <-- CAMBIA A 'prod' cuando ya estés en producción

const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyGMiQUtjx-kknEK1KpKFu0OecQ8dA0Ox-aOBWsy-SJ5dLKW9vhlP2ONNzjb9xxAYNpHw/exec';
// URL del servidor que corre el endpoint de creación de transacciones
const PAYMENT_SERVER_URL = 'http://localhost:3000';

/* ============================================
   VARIABLES GLOBALES
============================================ */
window.totalBase = 0;

function getFrozenReference() {
  const key = 'wompi_frozen_reference';
  let ref = localStorage.getItem(key);
  if (!ref) {
    ref = `MM-${Date.now()}-${Math.random().toString(36).substr(2,9)}`;
    localStorage.setItem(key, ref);
  }
  return ref;
}

function generateReference() {
  // Always return a fresh unique reference for each payment attempt
  // and clear any previously stored frozen reference to avoid reuse.
  try { localStorage.removeItem('wompi_frozen_reference'); } catch (e) { /* ignore */ }
  return `MM-${Date.now()}-${Math.random().toString(36).substr(2,9)}`;
}

async function getOrCreateReference() {
  const key = 'wompi_frozen_reference';
  const tsKey = 'wompi_frozen_ts';
  try {
    let ref = localStorage.getItem(key);
    const ts = Number(localStorage.getItem(tsKey) || '0');
    const now = Date.now();
    const EXPIRY_MS = 1000 * 60 * 60; // 1 hour
    if (ref && (now - ts) < EXPIRY_MS) {
      // Check with server if reference already used
      try {
        const r = await fetch(`${PAYMENT_SERVER_URL}/api/reference-status?reference=${encodeURIComponent(ref)}`);
        if (r.ok) {
          const j = await r.json().catch(()=>({used:false}));
          if (!j.used) return ref;
          // used -> fallthrough to generate new
        }
      } catch (e) { /* if status check fails, keep ref to allow completing */ return ref; }
    }
    // generate new
    const newRef = `MM-${Date.now()}-${Math.random().toString(36).substr(2,9)}`;
    try { localStorage.setItem(key, newRef); localStorage.setItem(tsKey, String(Date.now())); } catch (e) {}
    return newRef;
  } catch (e) { return `MM-${Date.now()}-${Math.random().toString(36).substr(2,9)}`; }
}

/* ============================================
   INIT
============================================ */
function init() {
  const carrito = JSON.parse(localStorage.getItem('mm_cart_v1')) || [];
  const bdb = JSON.parse(localStorage.getItem('mm_baseDeDatos') || '[]');
  const datosEntrega = JSON.parse(localStorage.getItem('datos_entrega')) || {};

  cargarDatosAcudiente(datosEntrega);

  const allAreAleks = carrito.length > 0 && carrito.every(i => String(i.title || '').toLowerCase().includes('aleks'));
  document.getElementById('domicilio-section').style.display = allAreAleks ? 'none' : 'block';

  let total = calcularTotal(carrito, bdb);
  window.totalBase = total;
  actualizarTotalConDomicilio(total);

  agregarListeners();
  validarYCargarWidget();
}

/* ============================================
   DATOS ACUDIENTE
============================================ */
function cargarDatosAcudiente(datosEntrega) {
  const grid = document.getElementById('acudiente-grid');
  grid.innerHTML = '';

  const campos = [
    ['Nombre', ['acudiente', 'nombre', 'nombreAcudiente', 'parentName']],
    ['Documento', ['documento', 'docAcudiente', 'documentoAcudiente']],
    ['Teléfono', ['telefono', 'telefonoAcudiente', 'celular', 'phone', 'movil']],
    ['Dirección', ['direccion', 'domicilio', 'address', 'direccionEnvio']],
    ['Ciudad', ['ciudad', 'city']],
    ['Correo', ['email', 'parentEmail', 'correo', 'mail', 'emailAcudiente']],
    ['Colegio', ['colegio', 'school', 'schoolName', 'nombreColegio']],
    ['Curso', ['curso', 'grado', 'grade', 'gradeLevel', 'nivel']]
  ];

  campos.forEach(([label, keys]) => {
    let valor = '-';
    for (let key of keys) {
      if (datosEntrega[key] && String(datosEntrega[key]).trim()) {
        valor = datosEntrega[key];
        break;
      }
    }
    const div = document.createElement('div');
    div.className = 'acudiente-row';
    div.innerHTML = `<span class="acudiente-label">${label}</span><span class="acudiente-value">${valor}</span>`;
    grid.appendChild(div);
  });
}

/* ============================================
   TOTAL
============================================ */
function calcularTotal(carrito, bdb) {
  let total = 0;
  const norm = (s) => String(s || '').trim().toLowerCase();

  const html = carrito.map(item => {
    const match = bdb.find(r => norm(r.producto) === norm(item.title));
    const unitPrice = match ? Number(match.costo) : Number(item.price || 0);
    const subtotal = unitPrice * (item.qty || 1);
    total += subtotal;

    return `
      <div class="producto-row">
        <img src="${item.image || ''}" alt="${item.title}">
        <div style="flex: 1;">
          <strong>${item.title}</strong><br>
          Cantidad: ${item.qty || 1} • $${unitPrice.toLocaleString()}
        </div>
        <strong>$${subtotal.toLocaleString()}</strong>
      </div>
    `;
  }).join('');

  document.getElementById('lista-productos').innerHTML = html;
  localStorage.setItem('total_calc', total);
  return total;
}

function actualizarTotalConDomicilio(baseTotal) {
  const checkbox = document.getElementById('solicitar-domicilio');
  const info = document.querySelector('.domicilio-info');
  const COSTO_DOMICILIO = 13000;

  let totalFinal = baseTotal;
  if (checkbox && checkbox.checked) {
    totalFinal = baseTotal + COSTO_DOMICILIO;
    if (info) info.style.display = 'block';
  } else if (info) {
    info.style.display = 'none';
  }

  document.getElementById('total-precio').innerText = `Total: $${totalFinal.toLocaleString()}`;
  localStorage.setItem('total_calc', totalFinal);
}

/* ============================================
   LISTENERS
============================================ */
function agregarListeners() {
  const checkbox = document.getElementById('solicitar-domicilio');
  if (checkbox) {
    checkbox.addEventListener('change', () => {
      actualizarTotalConDomicilio(window.totalBase);
      document.getElementById('campos-domicilio-confirmacion').style.display = checkbox.checked ? 'block' : 'none';
      validarYCargarWidget();
    });
  }

  const campos = ['studentLastName', 'studentFirstName', 'studentGrade', 'studentDoc', 'studentEmail', 'studentAddress', 'studentPhone'];
  campos.forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener('input', validarYCargarWidget);
      el.addEventListener('change', validarYCargarWidget);
    }
  });
}

/* ============================================
  VALIDAR Y PREPARAR
============================================ */
async function validarYCargarWidget() {
  const container = document.getElementById('wompi-widget-container');

  const sLast = document.getElementById('studentLastName').value.trim();
  const sFirst = document.getElementById('studentFirstName').value.trim();
  const sGrade = document.getElementById('studentGrade').value.trim();
  const sDoc = document.getElementById('studentDoc').value.trim();
  const sEmail = document.getElementById('studentEmail').value.trim();

  if (!sLast || !sFirst || !sGrade || !sDoc || !sEmail) {
    container.innerHTML = '<p style="color: #ccc; font-size: 14px;">Completa todos los datos para ver la pasarela de pago</p>';
    return;
  }

  if (!/\S+@\S+\.\S+/.test(sEmail)) {
    container.innerHTML = '<p style="color: #ff6b6b; font-size: 14px;">Correo electrónico inválido</p>';
    return;
  }

  const checkbox = document.getElementById('solicitar-domicilio');
  if (checkbox && checkbox.checked) {
    const sAddress = document.getElementById('studentAddress').value.trim();
    const sPhone = document.getElementById('studentPhone').value.trim();
    if (!sAddress || !sPhone) {
      container.innerHTML = '<p style="color: #ff6b6b; font-size: 14px;">Completa dirección y teléfono para envío a domicilio</p>';
      return;
    }
  }

  const entrega = JSON.parse(localStorage.getItem('datos_entrega')) || {};
  entrega.student = { last: sLast, first: sFirst, grade: sGrade, doc: sDoc, email: sEmail };
  localStorage.setItem('datos_entrega', JSON.stringify(entrega));

  const total = Number(localStorage.getItem('total_calc') || 0);
  // Use a frozen reference if present and not used; otherwise create a new one
  const reference = await getOrCreateReference();
  const amountInCents = Math.round(total * 100);

  // Inyectar el widget automáticamente: solicitamos la firma y añadimos el script
  try {
    // Prevent duplicate or concurrent injections for the same reference
    if (container.dataset.widgetReference === String(reference) || container.getAttribute('data-widget-loading') === String(reference) || container.querySelector(`script[data-reference="${reference}"]`)) return;

    // mark as loading so concurrent calls don't duplicate the script
    container.setAttribute('data-widget-loading', String(reference));

    container.innerHTML = '';
    const status = document.createElement('div');
    status.style.color = '#333'; status.style.fontSize = '14px'; status.style.marginBottom = '12px';
    status.innerText = 'Solicitando firma para mostrar la pasarela...';
    container.appendChild(status);

    const sigResp = await fetch(`${PAYMENT_SERVER_URL}/api/generate-signature`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount_in_cents: amountInCents, reference, currency: WOMPI_CURRENCY })
    });
    const sigJson = await sigResp.json().catch(()=> ({}));
    if (!sigResp.ok || !sigJson.signature) {
      status.innerText = 'No se pudo obtener la firma para el widget.';
      container.removeAttribute('data-widget-loading');
      return;
    }

    const signature = sigJson.signature;
    // Validar llave pública
    if (!WOMPI_PUBLIC_KEY || (typeof WOMPI_PUBLIC_KEY !== 'string') || !WOMPI_PUBLIC_KEY.startsWith('pub_')) {
      status.innerText = 'Clave pública inválida o ausente.';
      container.removeAttribute('data-widget-loading');
      return;
    }

    // Inyectar script del widget
    const script = document.createElement('script');
    script.src = 'https://checkout.wompi.co/widget.js';
    script.async = true;
    script.setAttribute('data-render', 'button');
    script.setAttribute('data-public-key', WOMPI_PUBLIC_KEY);
    script.setAttribute('data-currency', WOMPI_CURRENCY);
    script.setAttribute('data-amount-in-cents', String(amountInCents));
    script.setAttribute('data-reference', String(reference));
    script.setAttribute('data-signature:integrity', signature);
    const safeRedirect = String(PAYMENT_SERVER_URL).startsWith('http://localhost') ? 'https://transaction-redirect.wompi.co/check' : (PAYMENT_SERVER_URL + '/transaction-result');
    script.setAttribute('data-redirect-url', safeRedirect);

    script.addEventListener('load', () => {
      try { if (status && status.parentNode) status.parentNode.removeChild(status); } catch(e){}
      container.setAttribute('data-widget-reference', String(reference));
      container.removeAttribute('data-widget-loading');
    });

    script.addEventListener('error', () => {
      try { if (status && status.parentNode) status.parentNode.removeChild(status); } catch(e){}
      container.removeAttribute('data-widget-loading');
      container.innerHTML = '<p style="color:#ff6b6b">Error cargando el widget.</p>';
    });

    container.appendChild(script);
  } catch (e) {
    container.removeAttribute('data-widget-loading');
    container.innerHTML = '<p style="color:#ff6b6b">Error preparando la pasarela.</p>';
    console.error(e);
  }
}

/* ============================================
   ABRIR PASARELA (WOMPI)
============================================ */
async function abrirPasarelaPago(amountInCents, reference, sEmail, sFirst, sLast) {
  const container = document.getElementById('wompi-widget-container');
  container.innerHTML = '';

  const status = document.createElement('div');
  status.style.color = '#333';
  status.style.fontSize = '14px';
  status.style.marginBottom = '12px';
  status.innerText = 'Preparando pasarela de pago...';
  container.appendChild(status);

  
    try {
      // Primero solicitamos la firma de integridad al servidor
      status.innerText = 'Solicitando firma al servidor...';
      const sigResp = await fetch(`${PAYMENT_SERVER_URL}/api/generate-signature`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount_in_cents: amountInCents, reference, currency: WOMPI_CURRENCY })
      });
      const sigJson = await sigResp.json().catch(() => ({}));
      if (!sigResp.ok || !sigJson.signature) {
        console.warn('Firma no disponible, fallback a creación de transacción en servidor', sigJson);
        // Fallback: pedir al servidor que cree la transacción y usar checkout_url
        status.innerText = 'Creando transacción en el servidor...';
        const resp = await fetch(`${PAYMENT_SERVER_URL}/api/create-transaction`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount_in_cents: amountInCents, currency: WOMPI_CURRENCY, email: sEmail, full_name: `${sFirst} ${sLast}`, reference, public_key: WOMPI_PUBLIC_KEY })
        });
        const text = await resp.text();
        let data = {};
        try { data = text ? JSON.parse(text) : {}; } catch (err) { data = { raw: text }; }
        const checkout = data.checkout_url || (data.data && data.data.checkout_url);
        if (checkout) { window.open(checkout, '_blank'); return; }
        container.innerHTML = '<p style="color: #ff6b6b; font-size: 14px;"><b>Error procesando pago</b></p>';
        return;
      }

      const signature = sigJson.signature;

      // Validar llave pública antes de inyectar
      if (!WOMPI_PUBLIC_KEY || (typeof WOMPI_PUBLIC_KEY !== 'string') || !WOMPI_PUBLIC_KEY.startsWith('pub_')) {
        container.innerHTML = '<p style="color:#ff6b6b">Clave pública inválida o ausente.</p>';
        return;
      }

      // Inyectar el script del widget con los data-attributes (incluyendo data-signature:integrity)
      status.innerText = 'Preparando botón del widget...';
      // Limpiar contenedor e insertar script tag configurado
      container.innerHTML = '';
      const script = document.createElement('script');
      script.src = 'https://checkout.wompi.co/widget.js';
      script.async = true;
      script.setAttribute('data-render', 'button');
      script.setAttribute('data-public-key', WOMPI_PUBLIC_KEY);
      script.setAttribute('data-currency', WOMPI_CURRENCY);
      script.setAttribute('data-amount-in-cents', String(amountInCents));
      script.setAttribute('data-reference', String(reference));
      // attribute name must include colon as per widget API
      script.setAttribute('data-signature:integrity', signature);
      // redirect to our server result endpoint (use safe redirect when running on localhost)
      const safeRedirect = String(PAYMENT_SERVER_URL).startsWith('http://localhost') ? 'https://transaction-redirect.wompi.co/check' : (PAYMENT_SERVER_URL + '/transaction-result');
      script.setAttribute('data-redirect-url', safeRedirect);
      // append optional expiration time if server returned it
      if (sigJson.payload && sigJson.payload.includes('T') && sigJson.payload.includes('Z')) {
        // If the server used expiration in the payload, try to extract it roughly and set attribute
        // The frontend should also pass expiration if desired; for now we skip precise parsing
      }
      container.appendChild(script);

      // After the widget script loads it will render a button.
      script.addEventListener('load', () => {
        status.innerText = 'Widget listo. Presiona el botón de pago para continuar.';
      });
      // Note: fallback to server-created checkout will be invoked only if widget fails to render or user chooses.

    } catch (e) {
      console.error(e);
      container.innerHTML = '<p style="color: #ff6b6b; font-size: 14px;"><b>Error procesando pago</b></p>';
    }
}

/* ============================================
   START
============================================ */
init();
