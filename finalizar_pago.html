<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resumen Final - Math Minds</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="styles.css">

  <script>
    const DISABLE_SW_ON_DEV = true;
    if ('serviceWorker' in navigator && !DISABLE_SW_ON_DEV) {
      try {
        navigator.serviceWorker.register('/sw-wompi-guard.js', { scope: '/' }).then(reg => {
          console.log('[wompi-sw] ServiceWorker registrado:', reg.scope);
        }).catch(err => console.warn('[wompi-sw] registro fallido:', err));
      } catch(e) {
        console.warn('[wompi-sw] registro error', e);
      }
    } else if (DISABLE_SW_ON_DEV) {
      console.log('[wompi-sw] Registro de ServiceWorker deshabilitado en modo desarrollo.');
      try {
        navigator.serviceWorker.getRegistrations().then(regs => {
          regs.forEach(r => {
            try { r.unregister().then(ok => console.log('[wompi-sw] Unregistered SW', r.scope, ok)); } catch(e){ console.warn('[wompi-sw] unregister error', e); }
          });
        }).catch(e => console.warn('[wompi-sw] getRegistrations failed', e));
      } catch(e) { console.warn('[wompi-sw] unregister error', e); }
    }
  </script>

  <style>
    :root { --black:#111; --purple:#13d6eba2; --light-gray:#f4f7f6; }
    body { background-color:var(--light-gray); font-family:'Poppins',sans-serif; margin:0; padding:0; }
    .header-mini { background:#fff; padding:15px 40px; border-bottom:2px solid var(--black); display:flex; align-items:center; gap:20px; }
    .logo-mini { width:80px; }
    .btn-back { text-decoration:none; color:var(--black); font-weight:700; font-size:13px; text-transform:uppercase; padding:8px 14px; border:1.5px solid var(--black); border-radius:10px; margin-left:auto; }
    .container-final { display:grid; grid-template-columns:1.2fr 0.8fr; gap:30px; max-width:1100px; margin:40px auto; padding:0 20px; }
    .card { background:#fff; border-radius:16px; padding:36px; box-shadow:0 8px 20px rgba(17,17,17,0.06); border:1px solid rgba(0,0,0,0.06); }
    h3 { margin-top:0; text-transform:uppercase; font-size:18px; border-bottom:2px solid var(--purple); display:inline-block; margin-bottom:28px; }
    .producto-row { display:flex; align-items:center; gap:15px; padding:15px 0; border-bottom:1px solid #eee; }
    .producto-row img { width:70px; height:60px; object-fit:contain; background:#f9f9f9; border-radius:10px; }
    .form-group { margin-bottom:22px; }
    .input-estudiante { width:100%; padding:14px 16px; border:1.5px solid rgba(0,0,0,0.12); border-radius:10px; font-size:15px; margin-top:8px; margin-bottom:0; box-sizing:border-box; line-height:1.5; }
    label { display:block; font-size:12px; color:#222; font-weight:600; margin-bottom:8px; letter-spacing:0.6px; }
    .student-note { color:#b30000; font-size:15px; font-weight:700; margin-bottom:28px; margin-top:0; line-height:1.6; }
    .acudiente-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px 24px; align-items:start; }
    .acudiente-row { background:#f9f9f9; padding:14px; border-radius:8px; }
    .acudiente-label { display:block; font-size:11px; color:#555; font-weight:700; margin-bottom:8px; }
    .acudiente-value { font-size:14px; color:#111; line-height:1.5; }
    .total-box { text-align:right; margin-top:20px; font-size:24px; font-weight:900; }
    .domicilio-section { background:#f0f8ff; padding:24px; border-radius:10px; margin-top:28px; margin-bottom:28px; border:1px solid #ccc; display:none; }
    .domicilio-section h4 { margin-top:0; margin-bottom:18px; font-size:16px; }
    .domicilio-section label { cursor:pointer; margin:0; line-height:1.5; }
    .domicilio-info { color:#666; font-size:13px; margin-top:12px; margin-bottom:0; display:none; }
    @media (max-width:850px){ .container-final{ grid-template-columns:1fr; } }
  </style>
</head>

<body>

<header class="header-mini">
  <img src="../Multimedia/Logo.png" alt="Logo" class="logo-mini">
  <a href="pago.html" class="btn-back">← Regresar</a>
</header>

<div class="container-final">

  <div class="card">
    <h3>Resumen de Libros/Kits</h3>
    <div id="lista-productos"></div>
    <div id="total-precio" class="total-box">Cargando total...</div>
  </div>

  <div class="card">
    <h3>Datos del Acudiente</h3>
    <div class="acudiente-grid" id="acudiente-grid"></div>
  </div>

  <div class="card">
    <h3>Datos del Estudiante</h3>
    <p class="student-note">Por favor completa los datos del ESTUDIANTE que recibirá los productos:</p>

    <div class="form-group">
      <label>APELLIDO</label>
      <input id="studentLastName" class="input-estudiante">
    </div>

    <div class="form-group">
      <label>NOMBRE</label>
      <input id="studentFirstName" class="input-estudiante">
    </div>

    <div class="form-group">
      <label>GRADO</label>
      <input id="studentGrade" class="input-estudiante">
    </div>

    <div class="form-group">
      <label>DOCUMENTO</label>
      <input id="studentDoc" class="input-estudiante">
    </div>

    <div class="form-group">
      <label>CORREO ELECTRÓNICO</label>
      <input id="studentEmail" type="email" class="input-estudiante">
    </div>

    <!-- Sección de Domicilio -->
    <div id="domicilio-section" class="domicilio-section">
      <h4>Envío a Domicilio</h4>
      <div style="display: flex; align-items: flex-start; gap: 12px;">
        <input type="checkbox" id="solicitar-domicilio" style="width: 20px; height: 20px; cursor: pointer; margin-top: 2px; flex-shrink: 0;">
        <label for="solicitar-domicilio">¿Deseas que enviemos a domicilio? Se añadirán $13.000 al total.</label>
      </div>
      <p class="domicilio-info">Se añadirán $13.000 al total por envío a domicilio.</p>
    </div>

    <div id="campos-domicilio-confirmacion" style="display: none;">
      <div class="form-group">
        <label>CONFIRMAR DIRECCIÓN DE ENVÍO</label>
        <input id="studentAddress" class="input-estudiante">
      </div>

      <div class="form-group">
        <label>CONFIRMAR TELÉFONO</label>
        <input id="studentPhone" type="tel" class="input-estudiante">
      </div>
    </div>

    <div id="wompi-widget-container" style="margin-top: 20px;"></div>
  </div>

</div>

<script>
/* ============================================
   CONFIG
============================================ */
const WOMPI_PUBLIC_KEY = 'pub_prod_axnI5F0BmAoXEmks4Ci1uzGiwV3B40gF';
const WOMPI_CURRENCY = 'COP';
const WOMPI_ENV = 'prod';

const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyGMiQUtjx-kknEK1KpKFu0OecQ8dA0Ox-aOBWsy-SJ5dLKW9vhlP2ONNzjb9xxAYNpHw/exec';
const PAYMENT_SERVER_URL = 'https://wompi-ybfs.onrender.com';

window.totalBase = 0;

function generateReference() {
  try { localStorage.removeItem('wompi_frozen_reference'); } catch (e) {}
  return `MM-${Date.now()}-${Math.random().toString(36).substr(2,9)}`;
}
async function getOrCreateReference() {
  try {
    const newRef = generateReference();
    try {
      localStorage.setItem('wompi_frozen_reference', newRef);
      localStorage.setItem('wompi_frozen_ts', String(Date.now()));
    } catch (e) {}
    return newRef;
  } catch (e) {
    return `MM-${Date.now()}-${Math.random().toString(36).substr(2,9)}`;
  }
}

/* ✅ NUEVO: sincroniza domicilio + confirmaciones a datos_entrega (para que llegue a Sheets) */
function syncDomicilioToLocalStorage_() {
  try {
    const checkbox = document.getElementById('solicitar-domicilio');
    const shipRequested = !!(checkbox && checkbox.checked);

    const entregaLocal = (() => {
      try { return JSON.parse(localStorage.getItem('datos_entrega') || '{}'); }
      catch(e){ return {}; }
    })();

    // Guardamos en varios nombres para máxima compatibilidad (Apps Script soporta ambos)
    entregaLocal.con_domicilio = shipRequested;
    entregaLocal.domicilio_costo = shipRequested ? 13000 : 0;

    entregaLocal.shipping_requested = shipRequested;
    entregaLocal.shipping_cost = shipRequested ? 13000 : 0;

    entregaLocal.domicilio_direccion_confirm = (document.getElementById('studentAddress')?.value || '').trim();
    entregaLocal.domicilio_telefono_confirm = (document.getElementById('studentPhone')?.value || '').trim();

    entregaLocal.shipping_address = entregaLocal.domicilio_direccion_confirm;
    entregaLocal.shipping_phone = entregaLocal.domicilio_telefono_confirm;

    localStorage.setItem('datos_entrega', JSON.stringify(entregaLocal));
  } catch(e) {}
}

/* ============================================
   INIT
============================================ */
function init() {
  const carrito = JSON.parse(localStorage.getItem('mm_cart_v1')) || [];
  const bdb = JSON.parse(localStorage.getItem('mm_baseDeDatos') || '[]');
  const datosEntrega = JSON.parse(localStorage.getItem('datos_entrega')) || {};

  cargarDatosAcudiente(datosEntrega);

  const allAreAleks = carrito.length > 0 && carrito.every(i => String(i.title || '').toLowerCase().includes('aleks'));
  document.getElementById('domicilio-section').style.display = allAreAleks ? 'none' : 'block';

  let total = calcularTotal(carrito, bdb);
  window.totalBase = total;
  actualizarTotalConDomicilio(total);

  agregarListeners();
  validarYCargarWidget();
}

/* ============================================
   DATOS ACUDIENTE
============================================ */
function cargarDatosAcudiente(datosEntrega) {
  const grid = document.getElementById('acudiente-grid');
  grid.innerHTML = '';

  const campos = [
    ['Nombre', ['acudiente', 'nombre', 'nombreAcudiente', 'parentName']],
    ['Documento', ['documento', 'docAcudiente', 'documentoAcudiente']],
    ['Teléfono', ['telefono', 'telefonoAcudiente', 'celular', 'phone', 'movil']],
    ['Dirección', ['direccion', 'domicilio', 'address', 'direccionEnvio']],
    ['Ciudad', ['ciudad', 'city']],
    ['Correo', ['email', 'parentEmail', 'correo', 'mail', 'emailAcudiente']],
    ['Colegio', ['colegio', 'school', 'schoolName', 'nombreColegio']],
    ['Curso', ['curso', 'grado', 'grade', 'gradeLevel', 'nivel']]
  ];

  campos.forEach(([label, keys]) => {
    let valor = '-';
    for (let key of keys) {
      if (datosEntrega[key] && String(datosEntrega[key]).trim()) {
        valor = datosEntrega[key];
        break;
      }
    }
    const div = document.createElement('div');
    div.className = 'acudiente-row';
    div.innerHTML = `<span class="acudiente-label">${label}</span><span class="acudiente-value">${valor}</span>`;
    grid.appendChild(div);
  });
}

/* ============================================
   TOTAL
============================================ */
function calcularTotal(carrito, bdb) {
  let total = 0;
  const norm = (s) => String(s || '').trim().toLowerCase();

  const html = carrito.map(item => {
    const match = bdb.find(r => norm(r.producto) === norm(item.title));
    const unitPrice = match ? Number(match.costo) : Number(item.price || 0);
    const subtotal = unitPrice * (item.qty || 1);
    total += subtotal;

    return `
      <div class="producto-row">
        <img src="${item.image || ''}" alt="${item.title}">
        <div style="flex: 1;">
          <strong>${item.title}</strong><br>
          Cantidad: ${item.qty || 1} • $${unitPrice.toLocaleString()}
        </div>
        <strong>$${subtotal.toLocaleString()}</strong>
      </div>
    `;
  }).join('');

  document.getElementById('lista-productos').innerHTML = html;
  localStorage.setItem('total_calc', total);
  return total;
}

function actualizarTotalConDomicilio(baseTotal) {
  const checkbox = document.getElementById('solicitar-domicilio');
  const info = document.querySelector('.domicilio-info');
  const COSTO_DOMICILIO = 13000;

  let totalFinal = baseTotal;
  if (checkbox && checkbox.checked) {
    totalFinal = baseTotal + COSTO_DOMICILIO;
    if (info) info.style.display = 'block';
  } else if (info) {
    info.style.display = 'none';
  }

  document.getElementById('total-precio').innerText = `Total: $${totalFinal.toLocaleString()}`;
  localStorage.setItem('total_calc', totalFinal);

  try {
    const lista = document.getElementById('lista-productos');
    if (lista) {
      const existing = document.getElementById('domicilio-row');
      if (checkbox && checkbox.checked) {
        if (!existing) {
          const row = document.createElement('div');
          row.id = 'domicilio-row';
          row.className = 'producto-row';
          row.innerHTML = `
            <div style="width:70px;height:60px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:10px;border:1px solid #eee;color:#888;font-size:12px;">Env</div>
            <div style="flex:1;">
              <strong>Domicilio</strong><br>
              Servicio de envío
            </div>
            <strong>$${COSTO_DOMICILIO.toLocaleString()}</strong>
          `;
          lista.appendChild(row);
        }
      } else {
        if (existing && existing.parentNode) existing.parentNode.removeChild(existing);
      }
    }
  } catch(e){ console.warn('actualizarTotalConDomicilio: fallo', e); }

  // ✅ NUEVO: guardar domicilio en datos_entrega cada vez que cambie total
  syncDomicilioToLocalStorage_();
}

/* ============================================
   LISTENERS
============================================ */
function agregarListeners() {
  const checkbox = document.getElementById('solicitar-domicilio');
  if (checkbox) {
    checkbox.addEventListener('change', () => {
      actualizarTotalConDomicilio(window.totalBase);
      document.getElementById('campos-domicilio-confirmacion').style.display = checkbox.checked ? 'block' : 'none';
      syncDomicilioToLocalStorage_(); // ✅ NUEVO
      validarYCargarWidget();
    });
  }

  const campos = ['studentLastName', 'studentFirstName', 'studentGrade', 'studentDoc', 'studentEmail', 'studentAddress', 'studentPhone'];
  campos.forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener('input', () => { syncDomicilioToLocalStorage_(); validarYCargarWidget(); });
      el.addEventListener('change', () => { syncDomicilioToLocalStorage_(); validarYCargarWidget(); });
    }
  });
}

/* ============================================
  VALIDAR Y PREPARAR
============================================ */
async function validarYCargarWidget() {
  const container = document.getElementById('wompi-widget-container');

  const sLast = document.getElementById('studentLastName').value.trim();
  const sFirst = document.getElementById('studentFirstName').value.trim();
  const sGrade = document.getElementById('studentGrade').value.trim();
  const sDoc = document.getElementById('studentDoc').value.trim();
  const sEmail = document.getElementById('studentEmail').value.trim();

  if (!sLast || !sFirst || !sGrade || !sDoc || !sEmail) {
    container.innerHTML = '<p style="color: #ccc; font-size: 14px;">Completa todos los datos para ver la pasarela de pago</p>';
    return;
  }

  if (!/\S+@\S+\.\S+/.test(sEmail)) {
    container.innerHTML = '<p style="color: #ff6b6b; font-size: 14px;">Correo electrónico inválido</p>';
    return;
  }

  const checkbox = document.getElementById('solicitar-domicilio');
  if (checkbox && checkbox.checked) {
    const sAddress = document.getElementById('studentAddress').value.trim();
    const sPhone = document.getElementById('studentPhone').value.trim();
    if (!sAddress || !sPhone) {
      container.innerHTML = '<p style="color: #ff6b6b; font-size: 14px;">Completa dirección y teléfono para envío a domicilio</p>';
      return;
    }
  }

  const entrega = JSON.parse(localStorage.getItem('datos_entrega')) || {};
  entrega.student = { last: sLast, first: sFirst, grade: sGrade, doc: sDoc, email: sEmail };
  // ✅ duplicado útil para Apps Script
  entrega.student_email = sEmail;
  localStorage.setItem('datos_entrega', JSON.stringify(entrega));

  // ✅ asegurar domicilio sincronizado
  syncDomicilioToLocalStorage_();

  const total = Number(localStorage.getItem('total_calc') || 0);
  const reference = await getOrCreateReference();
  const amountInCents = Math.round(total * 100);

  try {
    if (window.__mm_widget_loading) return;
    window.__mm_widget_loading = true;

    container.innerHTML = '';

    const status = document.createElement('div');
    status.style.color = '#333'; status.style.fontSize = '14px'; status.style.marginBottom = '12px';
    status.innerText = 'Solicitando firma para mostrar la pasarela...';
    container.appendChild(status);

    const sigResp = await fetch(`${PAYMENT_SERVER_URL}/api/generate-signature`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount_in_cents: amountInCents, reference, currency: WOMPI_CURRENCY })
    });
    const sigJson = await sigResp.json().catch(()=> ({}));
    if (!sigResp.ok || !sigJson.signature) {
      status.innerText = 'No se pudo obtener la firma para el widget.';
      window.__mm_widget_loading = false;
      return;
    }

    if (!WOMPI_PUBLIC_KEY || !String(WOMPI_PUBLIC_KEY).startsWith('pub_')) {
      status.innerText = 'Clave pública inválida o ausente.';
      window.__mm_widget_loading = false;
      return;
    }

    if (status && status.parentNode) try { status.parentNode.removeChild(status); } catch(e){}

    window.__mm_widget_reference = String(reference);
    window.__mm_widget_loading = false;

    const nativeBtn = document.createElement('button');
    nativeBtn.type = 'button';
    nativeBtn.textContent = 'Pagar Aqui';
    nativeBtn.style.padding = '12px 18px';
    nativeBtn.style.borderRadius = '10px';
    nativeBtn.style.background = '#13d6eb';
    nativeBtn.style.color = '#000';
    nativeBtn.style.border = 'none';
    nativeBtn.style.cursor = 'pointer';

    nativeBtn.addEventListener('click', (e) => {
      try { e.preventDefault(); } catch(_){}

      // ✅ Antes de abrir checkout, persistimos registro (con domicilio + confirmaciones)
      try { saveRegistrationIfNeeded_(reference); } catch(_){}

      const popup = window.open('about:blank', '_blank');
      abrirWebCheckout(amountInCents, reference, sEmail, sFirst, sLast, popup);
    });

    container.appendChild(nativeBtn);

  } catch (e) {
    window.__mm_widget_loading = false;
    container.innerHTML = '<p style="color:#ff6b6b">Error preparando la pasarela.</p>';
    console.error(e);
  }
}

/* ✅ NUEVO: persistir registro con el monto correcto (incluye domicilio si aplica) */
function saveRegistrationIfNeeded_(reference) {
  try {
    const ref = String(reference);
    window.__mm_saved_for_refs = window.__mm_saved_for_refs || {};
    if (window.__mm_saved_for_refs[ref]) return;

    // asegurar domicilio sincronizado
    syncDomicilioToLocalStorage_();

    const entregaLocal = (() => { 
      try { return JSON.parse(localStorage.getItem('datos_entrega')||'{}'); } 
      catch(e){ return {}; } 
    })() || {};

    const totalFinal = Number(localStorage.getItem('total_calc') || 0);
    const amountInCentsReal = Math.round(totalFinal * 100);

    const payload = Object.assign({}, entregaLocal, {
      reference: ref,
      amount_in_cents: amountInCentsReal,
      currency: WOMPI_CURRENCY,
      status: 'pending',
      paid: false
    });

    const endpoint = PAYMENT_SERVER_URL + '/api/save-registration';

    try {
      if (navigator && navigator.sendBeacon) {
        const blob = new Blob([JSON.stringify({ payload })], { type: 'application/json' });
        navigator.sendBeacon(endpoint, blob);
      } else {
        fetch(endpoint, { method: 'POST', headers: { 'Content-Type':'application/json' }, body: JSON.stringify({ payload }), keepalive: true }).catch(()=>{});
      }
    } catch(e) {
      fetch(endpoint, { method: 'POST', headers: { 'Content-Type':'application/json' }, body: JSON.stringify({ payload }) }).catch(()=>{});
    }

    window.__mm_saved_for_refs[ref] = true;
  } catch(e) {
    console.warn('saveRegistrationIfNeeded_ error', e);
  }
}

/* ============================================
   WEB CHECKOUT
============================================ */
async function abrirWebCheckout(amountInCents, reference, sEmail, sFirst, sLast, popup) {
  try {
    const sigResp = await fetch(`${PAYMENT_SERVER_URL}/api/generate-signature`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount_in_cents: amountInCents, reference, currency: WOMPI_CURRENCY })
    });

    const sigJson = await sigResp.json().catch(() => ({}));
    if (!sigResp.ok || !sigJson.signature) {
      alert('No fue posible obtener la firma. Intenta nuevamente.');
      if (popup && !popup.closed) popup.close();
      return;
    }

    const signature = sigJson.signature;

    if (!WOMPI_PUBLIC_KEY || !String(WOMPI_PUBLIC_KEY).startsWith('pub_')) {
      alert('Clave pública WOMPI inválida/ausente.');
      if (popup && !popup.closed) popup.close();
      return;
    }

    const params = new URLSearchParams();
    params.set('public-key', WOMPI_PUBLIC_KEY);
    params.set('currency', WOMPI_CURRENCY);
    params.set('amount-in-cents', String(amountInCents));
    params.set('reference', String(reference));
    params.set('signature:integrity', signature);

    params.set('redirect-url', 'https://mathmindscol.com/pago_exitoso.html');
    params.set('customer-data:email', sEmail || '');
    params.set('customer-data:full-name', `${sFirst || ''} ${sLast || ''}`.trim());

    const doc = (document.getElementById('studentDoc')?.value || '').trim();
    if (doc) {
      params.set('customer-data:legal-id', doc);
      params.set('customer-data:legal-id-type', 'CC');
    }

    const phone = (document.getElementById('studentPhone')?.value || '').trim();
    if (phone) params.set('customer-data:phone-number', phone);

    // ✅ mantener sincronizado domicilio (para Sheets)
    syncDomicilioToLocalStorage_();

    const url = `https://checkout.wompi.co/p/?${params.toString()}`;
    console.log('[WOMPI CHECKOUT URL]', url);

    if (popup && !popup.closed) popup.location.replace(url);
    else window.location.href = url;

  } catch (e) {
    console.error('abrirWebCheckout error', e);
    alert('Error al abrir Web Checkout. Intenta nuevamente.');
    if (popup && !popup.closed) popup.close();
  }
}

/* ============================================
   START
============================================ */
init();
</script>

</body>
</html>
