<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen Final - Math Minds</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --black: #111;
            --purple: #13d6eba2;
            --light-gray: #f4f7f6;
        }

        body {
            background-color: var(--light-gray);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Header minimalista */
        .header-mini {
            background: #fff;
            padding: 15px 40px;
            border-bottom: 2px solid var(--black);
            display: flex;
            align-items: center;
        }

        .logo-mini { width: 80px; }

        /* Layout en dos columnas */
        .container-final {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 30px;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: #fff;
            border: 2px solid var(--black);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        h3 {
            margin-top: 0;
            text-transform: uppercase;
            font-size: 18px;
            border-bottom: 2px solid var(--purple);
            display: inline-block;
            margin-bottom: 20px;
        }

        /* Estilo de productos */
        .producto-row {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .producto-row img {
            width: 70px;
            height: 60px;
            object-fit: contain;
            background: #f9f9f9;
            border-radius: 10px;
        }

        .producto-info { flex: 1; }
        .producto-info strong { display: block; font-size: 15px; }
        .producto-info span { font-size: 13px; color: #666; }

        /* Datos estáticos (Bloqueados) */
        .datos-bloqueados {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            border-left: 4px solid var(--black);
        }

        .dato-item { margin-bottom: 10px; }
        .dato-item small { 
            display: block; 
            text-transform: uppercase; 
            font-size: 10px; 
            color: #888; 
            font-weight: 700;
        }
        .dato-item span { font-weight: 600; color: #333; }

        /* Input Estudiante */
        .input-estudiante {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--black);
            border-radius: 12px;
            font-size: 16px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        .total-box {
            text-align: right;
            margin-top: 20px;
            font-size: 24px;
            font-weight: 900;
        }

        .btn-whatsapp {
            width: 100%;
            background: var(--purple); /* Color oficial WhatsApp */
            color: white;
            border: none;
            padding: 20px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-whatsapp:hover { transform: scale(1.02); background: #1eb954; }

        @media (max-width: 850px) {
            .container-final { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header class="header-mini"><img src="../Multimedia/Logo.png" alt="Logo" class="logo-mini"></header>

    <div class="container-final">
        <div class="card">
            <h3>Resumen de Libros/Kits</h3>
            <div id="lista-productos"></div>
            <div id="total-precio" class="total-box">Cargando total...</div>
        </div>

        <div class="card">
            <h3>Confirmación Final</h3>
            <div id="datos-envio" class="datos-bloqueados"></div>
            
            <div class="form-group">
                <label style="font-weight:700; font-size:12px;">NOMBRE DEL ESTUDIANTE</label>
                <input type="text" id="studentName" class="input-estudiante" placeholder="Nombre completo">
            </div>
            <div class="form-group" style="margin-top:15px;">
                <label style="font-weight:700; font-size:12px;">DOCUMENTO DEL ESTUDIANTE (T.I.)</label>
                <input type="text" id="studentDoc" class="input-estudiante" placeholder="Número de documento">
            </div>

            <button onclick="enviarWhatsApp()" class="btn-whatsapp">PAGAR</button>
        </div>
    </div>

    <script>
        const EXCEL_URL = 'TU_URL_CSV_DE_GOOGLE_SHEETS';

        function init() {
            const entrega = JSON.parse(localStorage.getItem('datos_entrega'));
            if (!entrega) { window.location.href = 'finalizar_pago.html'; return; }

            document.getElementById('datos-envio').innerHTML = `
                <div class="dato-item"><small>Acudiente</small><span>${entrega.acudiente} (${entrega.email})</span></div>
                <div class="dato-item"><small>Colegio / Curso</small><span>${entrega.colegio} - ${entrega.curso}</span></div>
                <div class="dato-item"><small>Ubicación</small><span>${entrega.direccion}, ${entrega.ciudad}</span></div>
            `;

            const carrito = JSON.parse(localStorage.getItem('mm_cart_v1')) || [];
                // Load DB snapshot (saved by main.js) to get product prices
                let bdb = [];
                try{ bdb = JSON.parse(localStorage.getItem('mm_baseDeDatos') || '[]'); }catch(e){ bdb = []; }

                function norm(s){ try{ return String(s||'').normalize('NFC').trim().toLowerCase(); }catch(e){ return String(s||'').trim().toLowerCase(); } }

                // Build product rows with resolved price (from baseDeDatos) or fallback to item.price
                let total = 0;
                const rowsHtml = carrito.map(i => {
                    const title = i.title || i.nombre || '';
                    const qty = Number(i.qty || 1);
                    // Prefer matching DB row by item-level colegio/grado if present
                    const itemColegio = (i.colegio) ? norm(i.colegio) : (entrega && entrega.colegio ? norm(entrega.colegio) : null);
                    const itemGrado = (i.grado) ? norm(i.grado) : (entrega && entrega.curso ? norm(entrega.curso) : null);
                    let match = null;
                    if (itemColegio && itemGrado){
                        match = bdb.find(r => norm(r.colegio) === itemColegio && norm(r.grado) === itemGrado && (norm(r.producto) === norm(title) || norm(title).includes(norm(r.producto))));
                    }
                    if (!match && itemColegio){
                        match = bdb.find(r => norm(r.colegio) === itemColegio && (norm(r.producto) === norm(title) || norm(title).includes(norm(r.producto))));
                    }
                    // global fallback
                    if (!match){ match = bdb.find(r => norm(r.producto) === norm(title)) || bdb.find(r => norm(title).includes(norm(r.producto))) || null; }
                    const unit = match ? Number(match.costo || 0) : (Number(i.price || i.precio || 0) || 0);
                    const subtotal = unit * qty;
                    total += subtotal;
                    return `
                        <div class="producto-row">
                            <img src="${i.image || ''}" alt="">
                            <div style="flex:1"><strong>${title}</strong><br><span>Cantidad: ${qty} • Precio unitario: $${unit.toLocaleString()}</span></div>
                            <div style="font-weight:800">$${subtotal.toLocaleString()}</div>
                        </div>
                    `;
                }).join('') || '<p>No hay productos en el carrito.</p>';

                document.getElementById('lista-productos').innerHTML = rowsHtml;
                document.getElementById('total-precio').innerText = `Total: $${total.toLocaleString()}`;
                try{ localStorage.setItem('total_calc', total); }catch(e){}
        }

        function enviarWhatsApp() {
            const entrega = JSON.parse(localStorage.getItem('datos_entrega'));
            const sName = document.getElementById('studentName').value;
            const sDoc = document.getElementById('studentDoc').value;
            const total = localStorage.getItem('total_calc') || "Pendiente";

            if(!sName || !sDoc) { alert("Completa los datos del estudiante"); return; }

            const txt = `*NUEVO PEDIDO MATH MINDS*%0A%0A` +
                        `*ACUDIENTE:* ${entrega.acudiente}%0A` +
                        `*EMAIL:* ${entrega.email}%0A` +
                        `*COLEGIO:* ${entrega.colegio}%0A` +
                        `*CURSO:* ${entrega.curso}%0A%0A` +
                        `*ESTUDIANTE:*%0A` +
                        `- Nombre: ${sName}%0A` +
                        `- Documento: ${sDoc}%0A%0A` +
                        `*DIRECCIÓN:* ${entrega.direccion}%0A` +
                        `*TOTAL:* $${total}`;

            window.open(`https://wa.me/573132644265?text=${txt}`, '_blank');
        }
        init();
    </script>
</body>
</html>
