<script>
/* ============================================
   CONFIG WOMPI + APPS SCRIPT (NO TOCAR EL DISEÑO)
============================================ */
// Usa la llave pública de prueba que proporcionaste
const WOMPI_PUBLIC_KEY = 'pub_test_B3FDnEk0nvEP7EUFzOEoRPl0N8HKGsgK';
const WOMPI_CURRENCY = 'COP';



const WOMPI_ENV = 'test'; // <-- CAMBIA A 'prod' cuando ya estés en producción

const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyGMiQUtjx-kknEK1KpKFu0OecQ8dA0Ox-aOBWsy-SJ5dLKW9vhlP2ONNzjb9xxAYNpHw/exec';
// URL del servidor que corre el endpoint de creación de transacciones
// Use same-origin when served over http(s). If opened via file:// fallback to localhost:3000
let PAYMENT_SERVER_URL = 'http://localhost:3000';
try{
  // Only assume the page and the payment server are the same origin when
  // the current page is actually served from the payment server (port 3000
  // or hostname localhost). This avoids cases where a live-reload/static
  // server (different port) would receive API requests and respond "Cannot GET".
  if (typeof window !== 'undefined' && window.location && window.location.protocol && window.location.protocol.startsWith('http')) {
    const isLocalhost = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1');
    if (isLocalhost && (window.location.port === '3000' || window.location.port === '' || window.location.port === undefined)) {
      PAYMENT_SERVER_URL = window.location.origin;
    }
  }
}catch(e){}

/* ============================================
   VARIABLES GLOBALES
============================================ */
window.totalBase = 0;

function getFrozenReference() {
  const key = 'wompi_frozen_reference';
  let ref = localStorage.getItem(key);
  if (!ref) {
    ref = `MM-${Date.now()}-${Math.random().toString(36).substr(2,9)}`;
    localStorage.setItem(key, ref);
  }
  return ref;
}

function generateReference() {
  // Always return a fresh unique reference for each payment attempt
  // and clear any previously stored frozen reference to avoid reuse.
  try { localStorage.removeItem('wompi_frozen_reference'); } catch (e) { /* ignore */ }
  return `MM-${Date.now()}-${Math.random().toString(36).substr(2,9)}`;
}

async function getOrCreateReference() {
  // Always generate and return a fresh reference to avoid reuse.
  // This ensures every payment attempt uses a unique reference and prevents 'reference already used' errors.
  try {
    const newRef = generateReference();
    try { localStorage.setItem('wompi_frozen_reference', newRef); localStorage.setItem('wompi_frozen_ts', String(Date.now())); } catch (e) {}
    return newRef;
  } catch (e) {
    return `MM-${Date.now()}-${Math.random().toString(36).substr(2,9)}`;
  }
}

/* ============================================
   INIT
============================================ */
function init() {
  const carrito = JSON.parse(localStorage.getItem('mm_cart_v1')) || [];
  const bdb = JSON.parse(localStorage.getItem('mm_baseDeDatos') || '[]');
  const datosEntrega = JSON.parse(localStorage.getItem('datos_entrega')) || {};

  cargarDatosAcudiente(datosEntrega);

  const allAreAleks = carrito.length > 0 && carrito.every(i => String(i.title || '').toLowerCase().includes('aleks'));
  document.getElementById('domicilio-section').style.display = allAreAleks ? 'none' : 'block';

  let total = calcularTotal(carrito, bdb);
  window.totalBase = total;
  actualizarTotalConDomicilio(total);

  agregarListeners();
  validarYCargarWidget();
}

/* ============================================
   DATOS ACUDIENTE
============================================ */
function cargarDatosAcudiente(datosEntrega) {
  const grid = document.getElementById('acudiente-grid');
  grid.innerHTML = '';

  const campos = [
    ['Nombre', ['acudiente', 'nombre', 'nombreAcudiente', 'parentName']],
    ['Documento', ['documento', 'docAcudiente', 'documentoAcudiente']],
    ['Teléfono', ['telefono', 'telefonoAcudiente', 'celular', 'phone', 'movil']],
    ['Dirección', ['direccion', 'domicilio', 'address', 'direccionEnvio']],
    ['Ciudad', ['ciudad', 'city']],
    ['Correo', ['email', 'parentEmail', 'correo', 'mail', 'emailAcudiente']],
    ['Colegio', ['colegio', 'school', 'schoolName', 'nombreColegio']],
    ['Curso', ['curso', 'grado', 'grade', 'gradeLevel', 'nivel']]
  ];

  campos.forEach(([label, keys]) => {
    let valor = '-';
    for (let key of keys) {
      if (datosEntrega[key] && String(datosEntrega[key]).trim()) {
        valor = datosEntrega[key];
        break;
      }
    }
    const div = document.createElement('div');
    div.className = 'acudiente-row';
    div.innerHTML = `<span class="acudiente-label">${label}</span><span class="acudiente-value">${valor}</span>`;
    grid.appendChild(div);
  });
}

/* ============================================
   TOTAL
============================================ */
function calcularTotal(carrito, bdb) {
  let total = 0;
  const norm = (s) => String(s || '').trim().toLowerCase();

  const html = carrito.map(item => {
    const match = bdb.find(r => norm(r.producto) === norm(item.title));
    const unitPrice = match ? Number(match.costo) : Number(item.price || 0);
    const subtotal = unitPrice * (item.qty || 1);
    total += subtotal;

    return `
      <div class="producto-row">
        <img src="${item.image || ''}" alt="${item.title}">
        <div style="flex: 1;">
          <strong>${item.title}</strong><br>
          Cantidad: ${item.qty || 1} • $${unitPrice.toLocaleString()}
        </div>
        <strong>$${subtotal.toLocaleString()}</strong>
      </div>
    `;
  }).join('');

  document.getElementById('lista-productos').innerHTML = html;
  localStorage.setItem('total_calc', total);
  return total;
}

function actualizarTotalConDomicilio(baseTotal) {
  const checkbox = document.getElementById('solicitar-domicilio');
  const info = document.querySelector('.domicilio-info');
  const COSTO_DOMICILIO = 13000;

  let totalFinal = baseTotal;
  if (checkbox && checkbox.checked) {
    totalFinal = baseTotal + COSTO_DOMICILIO;
    if (info) info.style.display = 'block';
  } else if (info) {
    info.style.display = 'none';
  }

  document.getElementById('total-precio').innerText = `Total: $${totalFinal.toLocaleString()}`;
  localStorage.setItem('total_calc', totalFinal);
}

/* ============================================
   LISTENERS
============================================ */
function agregarListeners() {
  const checkbox = document.getElementById('solicitar-domicilio');
  if (checkbox) {
    checkbox.addEventListener('change', () => {
      actualizarTotalConDomicilio(window.totalBase);
      document.getElementById('campos-domicilio-confirmacion').style.display = checkbox.checked ? 'block' : 'none';
      validarYCargarWidget();
    });
  }

  const campos = ['studentLastName', 'studentFirstName', 'studentGrade', 'studentDoc', 'studentEmail', 'studentAddress', 'studentPhone'];
  campos.forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener('input', validarYCargarWidget);
      el.addEventListener('change', validarYCargarWidget);
    }
  });
}

/* ============================================
  VALIDAR Y PREPARAR
============================================ */
async function validarYCargarWidget() {
  const container = document.getElementById('wompi-widget-container');

  const sLast = document.getElementById('studentLastName').value.trim();
  const sFirst = document.getElementById('studentFirstName').value.trim();
  const sGrade = document.getElementById('studentGrade').value.trim();
  const sDoc = document.getElementById('studentDoc').value.trim();
  const sEmail = document.getElementById('studentEmail').value.trim();

  if (!sLast || !sFirst || !sGrade || !sDoc || !sEmail) {
    container.innerHTML = '<p style="color: #ccc; font-size: 14px;">Completa todos los datos para ver la pasarela de pago</p>';
    return;
  }

  if (!/\S+@\S+\.\S+/.test(sEmail)) {
    container.innerHTML = '<p style="color: #ff6b6b; font-size: 14px;">Correo electrónico inválido</p>';
    return;
  }

  const checkbox = document.getElementById('solicitar-domicilio');
  if (checkbox && checkbox.checked) {
    const sAddress = document.getElementById('studentAddress').value.trim();
    const sPhone = document.getElementById('studentPhone').value.trim();
    if (!sAddress || !sPhone) {
      container.innerHTML = '<p style="color: #ff6b6b; font-size: 14px;">Completa dirección y teléfono para envío a domicilio</p>';
      return;
    }
  }

  const entrega = JSON.parse(localStorage.getItem('datos_entrega')) || {};
  entrega.student = { last: sLast, first: sFirst, grade: sGrade, doc: sDoc, email: sEmail };
  localStorage.setItem('datos_entrega', JSON.stringify(entrega));

  const total = Number(localStorage.getItem('total_calc') || 0);
  // Use a stable reference for the current payment attempt (avoid regenerating on every input)
  const reference = await getOrCreateReference();
  const amountInCents = Math.round(total * 100);

  // Auto-inject the Wompi widget once (prevent duplicates)
  try {
    // If widget is already injected on the page, do nothing
    if (window.__mm_widget_injected) return;
    // If a widget injection is already in progress, skip duplicate starts
    if (window.__mm_widget_loading) return;
    window.__mm_widget_loading = true;

    // Clean any previous content and remove any previous widget script tags to avoid duplicates
    container.innerHTML = '';
    const existingScripts = Array.from(document.querySelectorAll('script[src="https://checkout.wompi.co/widget.js"]'));
    existingScripts.forEach(s => { try { s.parentNode && s.parentNode.removeChild(s); } catch (e){} });

    // mark as loading so concurrent calls don't duplicate the script
    container.setAttribute('data-widget-loading', String(reference));

    const status = document.createElement('div');
    status.style.color = '#333'; status.style.fontSize = '14px'; status.style.marginBottom = '12px';
    status.innerText = 'Solicitando firma para mostrar la pasarela...';
    container.appendChild(status);

    const sigResp = await fetch(`${PAYMENT_SERVER_URL}/api/generate-signature`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount_in_cents: amountInCents, reference, currency: WOMPI_CURRENCY })
    });
    const sigJson = await sigResp.json().catch(()=> ({}));
    if (!sigResp.ok || !sigJson.signature) {
      status.innerText = 'No se pudo obtener la firma para el widget.';
      container.removeAttribute('data-widget-loading');
      return;
    }

    const signature = sigJson.signature;

    // Do not persist or send any registration from the client side.
    // All Google Sheets updates will occur only when the server receives the payment webhook.

    // Validar llave pública
    if (!WOMPI_PUBLIC_KEY || (typeof WOMPI_PUBLIC_KEY !== 'string') || !WOMPI_PUBLIC_KEY.startsWith('pub_')) {
      status.innerText = 'Clave pública inválida o ausente.';
      container.removeAttribute('data-widget-loading');
      return;
    }

    // Inyectar script del widget
    const script = document.createElement('script');
    script.src = 'https://checkout.wompi.co/widget.js';
    script.async = true;
    script.setAttribute('data-render', 'button');
    script.setAttribute('data-public-key', WOMPI_PUBLIC_KEY);
    script.setAttribute('data-currency', WOMPI_CURRENCY);
    script.setAttribute('data-amount-in-cents', String(amountInCents));
    script.setAttribute('data-reference', String(reference));
    script.setAttribute('data-signature:integrity', signature);
    const safeRedirect = (PAYMENT_SERVER_URL && String(PAYMENT_SERVER_URL).startsWith('http://localhost')) ? 'https://transaction-redirect.wompi.co/check' : (PAYMENT_SERVER_URL + '/transaction-result');
    script.setAttribute('data-redirect-url', safeRedirect);

    script.addEventListener('load', () => {
      try { if (status && status.parentNode) status.parentNode.removeChild(status); } catch(e){}
      container.setAttribute('data-widget-reference', String(reference));
      container.removeAttribute('data-widget-loading');
      window.__mm_widget_injected = true;
      window.__mm_widget_reference = String(reference);
      window.__mm_widget_loading = false;
      // Setup observer to detect widget iframe open/close and persist registration if needed
      try {
        const saveIfNeeded = () => {
          try {
            if (!window.__mm_widget_reference) return;
            const ref = String(window.__mm_widget_reference);
            if (window.__mm_saved_for_refs && window.__mm_saved_for_refs[ref]) return;
            const entregaLocal = (function(){ try { return JSON.parse(localStorage.getItem('datos_entrega')||'{}'); } catch(e){ return {}; } })() || {};
            const payload = Object.assign({}, entregaLocal, { reference: ref, amount_in_cents: Math.round(window.totalBase * 100), currency: WOMPI_CURRENCY, status: 'pending', paid: false });
            const endpoint = PAYMENT_SERVER_URL + '/api/save-registration';
            try{
              if (navigator && navigator.sendBeacon) {
                const blob = new Blob([JSON.stringify({ payload })], { type: 'application/json' });
                navigator.sendBeacon(endpoint, blob);
              } else {
                fetch(endpoint, { method: 'POST', headers: { 'Content-Type':'application/json' }, body: JSON.stringify({ payload }), keepalive: true }).catch(()=>{});
              }
            }catch(e){ try{ fetch(endpoint, { method: 'POST', headers: { 'Content-Type':'application/json' }, body: JSON.stringify({ payload }) }).catch(()=>{}); }catch(_){}
            }
            window.__mm_saved_for_refs = window.__mm_saved_for_refs || {};
            window.__mm_saved_for_refs[ref] = true;
          } catch(e){ console.warn('saveIfNeeded error', e); }
        };

        // Observe iframes added/removed (widget may create an iframe/modal)
        const mo = new MutationObserver((mutations) => {
          for (const m of mutations) {
            if (m.addedNodes && m.addedNodes.length) {
              for (const n of m.addedNodes) {
                try { if (n.tagName === 'IFRAME' && (n.src||'').includes('wompi')) { /* iframe opened */ } } catch(e){}
              }
            }
            if (m.removedNodes && m.removedNodes.length) {
              for (const n of m.removedNodes) {
                try { if (n.tagName === 'IFRAME' && (n.src||'').includes('wompi')) { /* iframe closed */ saveIfNeeded(); } } catch(e){}
              }
            }
          }
        });
        mo.observe(document.body, { childList: true, subtree: true });

        // Try to attach a one-time click handler to the widget button so we
        // persist the registration when the user explicitly clicks to pay.
        const attachButtonClick = () => {
          try {
            const btn = container.querySelector('button');
            if (btn) {
              btn.addEventListener('click', () => {
                try { saveIfNeeded(); } catch(e){}
              }, { once: true });
            }
          } catch (e) { /* ignore */ }
        };
        attachButtonClick();

        // Also attempt to attach when new nodes are added (widget may render later)
        const btnObserver = new MutationObserver((mutations) => { attachButtonClick(); });
        btnObserver.observe(container, { childList: true, subtree: true });

        // Also save when window regains focus (user returned from external checkout)
        window.addEventListener('focus', () => { setTimeout(saveIfNeeded, 250); });
      } catch(e) { console.warn('widget save observer setup failed', e); }
    });

    // No delegated click handler: do not send or queue data on widget click.
    // The registration is persisted to the server when the signature is generated,
    // and the webhook will forward the row to Google Sheets when payment is confirmed.

    script.addEventListener('error', () => {
      try { if (status && status.parentNode) status.parentNode.removeChild(status); } catch(e){}
      container.removeAttribute('data-widget-loading');
      window.__mm_widget_loading = false;
      window.__mm_widget_injected = false;
      // Show user-friendly fallback and attempt to allow manual checkout
      container.innerHTML = '<p style="color:#ff6b6b">Error cargando el widget. Usa la opción alternativa abajo para continuar con el pago.</p>';
      // create fallback button
      try{
        const fb = document.createElement('button');
        fb.type = 'button';
        fb.textContent = 'Pagar (alternativa)';
        fb.style.padding = '12px 18px'; fb.style.borderRadius='10px'; fb.style.background='#13d6eb'; fb.style.color='#000'; fb.style.border='none'; fb.style.cursor='pointer';
        fb.addEventListener('click', async () => {
          try{
            // Prepare payload same as widget click
            const entrega = JSON.parse(localStorage.getItem('datos_entrega') || '{}') || {};
            const studentPayload = {
              student: {
                first: (document.getElementById('studentFirstName') && document.getElementById('studentFirstName').value) || '',
                last: (document.getElementById('studentLastName') && document.getElementById('studentLastName').value) || '',
                grade: (document.getElementById('studentGrade') && document.getElementById('studentGrade').value) || '',
                doc: (document.getElementById('studentDoc') && document.getElementById('studentDoc').value) || '',
                email: (document.getElementById('studentEmail') && document.getElementById('studentEmail').value) || ''
              }
            };
            const payloadToSheet = Object.assign({}, entrega, studentPayload, { reference, amount_in_cents: amountInCents, currency: WOMPI_CURRENCY, status: 'pending', paid: false });
            // send to sheet (queue/sendBeacon)

            // Do not queue or send sheet data here; registration is saved on signature and webhook will handle Sheets update.

            // Create transaction on server and open checkout_url
            try{
              const resp = await fetch(`${PAYMENT_SERVER_URL}/api/create-transaction`, { method:'POST', headers: { 'Content-Type':'application/json' }, body: JSON.stringify({ amount_in_cents: amountInCents, currency: WOMPI_CURRENCY, email: payloadToSheet.student && payloadToSheet.student.email || entrega.email, full_name: ((payloadToSheet.student && ((payloadToSheet.student.first||'') + ' ' + (payloadToSheet.student.last||''))) || entrega.acudiente || ''), reference, public_key: WOMPI_PUBLIC_KEY }) });
              const txt = await resp.text(); let data={}; try{ data = txt ? JSON.parse(txt) : {}; }catch(e){ data = { raw: txt }; }
              const checkout = data.checkout_url || (data.data && data.data.checkout_url);
              if (checkout) { window.open(checkout, '_blank'); } else { alert('No se pudo crear la transacción. Intenta nuevamente.'); }
            }catch(e){ console.warn('create-transaction failed', e); alert('No se pudo iniciar el pago automáticamente.'); }
          }catch(e){ console.warn('fallback button error', e); }
        });
        container.appendChild(fb);
      }catch(e){ console.warn('failed to create fallback button', e); }
    });

    container.appendChild(script);
  } catch (e) {
    container.removeAttribute('data-widget-loading');
    container.innerHTML = '<p style="color:#ff6b6b">Error preparando la pasarela.</p>';
    console.error(e);
  }
}

/* ============================================
   ABRIR PASARELA (WOMPI)
============================================ */
async function abrirPasarelaPago(amountInCents, reference, sEmail, sFirst, sLast) {
  const container = document.getElementById('wompi-widget-container');
  // If our widget is already injected for this reference, try to trigger its button instead of reinjecting
  if (window.__mm_widget_injected && window.__mm_widget_reference === String(reference)) {
    try {
      const existingBtn = container.querySelector('button');
      if (existingBtn) { existingBtn.click(); return; }
    } catch (e) { /* ignore and continue to re-create */ }
  }
  container.innerHTML = '';

  const status = document.createElement('div');
  status.style.color = '#333';
  status.style.fontSize = '14px';
  status.style.marginBottom = '12px';
  status.innerText = 'Preparando pasarela de pago...';
  container.appendChild(status);

  
    try {
      // Nota: no persistimos automáticamente al abrir la pasarela aquí porque
      // la inyección del widget puede ocurrir mientras el usuario aún está
      // escribiendo campos y podría causar envíos prematuros.
      // En su lugar, registraremos el intento solo cuando el usuario haga
      // clic en el botón del widget (ver abajo).
      // Primero solicitamos la firma de integridad al servidor
      status.innerText = 'Solicitando firma al servidor...';
      const sigResp = await fetch(`${PAYMENT_SERVER_URL}/api/generate-signature`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount_in_cents: amountInCents, reference, currency: WOMPI_CURRENCY })
      });
      const sigJson = await sigResp.json().catch(() => ({}));
      if (!sigResp.ok || !sigJson.signature) {
        console.warn('Firma no disponible, fallback a creación de transacción en servidor', sigJson);
        // Fallback: pedir al servidor que cree la transacción y usar checkout_url
        status.innerText = 'Creando transacción en el servidor...';
        const resp = await fetch(`${PAYMENT_SERVER_URL}/api/create-transaction`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount_in_cents: amountInCents, currency: WOMPI_CURRENCY, email: sEmail, full_name: `${sFirst} ${sLast}`, reference, public_key: WOMPI_PUBLIC_KEY })
        });
        const text = await resp.text();
        let data = {};
        try { data = text ? JSON.parse(text) : {}; } catch (err) { data = { raw: text }; }
        const checkout = data.checkout_url || (data.data && data.data.checkout_url);
        if (checkout) { window.open(checkout, '_blank'); return; }
        container.innerHTML = '<p style="color: #ff6b6b; font-size: 14px;"><b>Error procesando pago</b></p>';
        return;
      }

      const signature = sigJson.signature;

      // Validar llave pública antes de inyectar
      if (!WOMPI_PUBLIC_KEY || (typeof WOMPI_PUBLIC_KEY !== 'string') || !WOMPI_PUBLIC_KEY.startsWith('pub_')) {
        container.innerHTML = '<p style="color:#ff6b6b">Clave pública inválida o ausente.</p>';
        return;
      }

      // Inyectar el script del widget con los data-attributes (incluyendo data-signature:integrity)
      status.innerText = 'Preparando botón del widget...';
      // Limpiar contenedor e insertar script tag configurado
      container.innerHTML = '';
      const script = document.createElement('script');
      script.src = 'https://checkout.wompi.co/widget.js';
      script.async = true;
      script.setAttribute('data-render', 'button');
      script.setAttribute('data-public-key', WOMPI_PUBLIC_KEY);
      script.setAttribute('data-currency', WOMPI_CURRENCY);
      script.setAttribute('data-amount-in-cents', String(amountInCents));
      script.setAttribute('data-reference', String(reference));
      // attribute name must include colon as per widget API
      script.setAttribute('data-signature:integrity', signature);
      // redirect to our server result endpoint (use safe redirect when running on localhost)
      const safeRedirect = (PAYMENT_SERVER_URL && String(PAYMENT_SERVER_URL).startsWith('http://localhost')) ? 'https://transaction-redirect.wompi.co/check' : (PAYMENT_SERVER_URL + '/transaction-result');
      script.setAttribute('data-redirect-url', safeRedirect);
      // append optional expiration time if server returned it
      if (sigJson.payload && sigJson.payload.includes('T') && sigJson.payload.includes('Z')) {
        // If the server used expiration in the payload, try to extract it roughly and set attribute
        // The frontend should also pass expiration if desired; for now we skip precise parsing
      }
      container.appendChild(script);

      // After the widget script loads it will render a button. We attach
      // a MutationObserver to detect when the button appears and then
      // add a one-time click handler that will persist the registration
      // to the sheet and allow the payment to proceed. This avoids
      // creating the sheet row while the user is still typing.
      script.addEventListener('load', () => {
        status.innerText = 'Widget listo. Presiona el botón de pago para continuar.';
        // Do not attach any click handler to the widget; all sheet writes will be performed server-side when webhook confirms payment.
        // However, ensure we persist the registration if the widget modal closes or the user returns to the page.
        try {
          const saveIfNeeded = () => {
            try {
              const ref = String(reference);
              if (window.__mm_saved_for_refs && window.__mm_saved_for_refs[ref]) return;
              const entregaLocal = (function(){ try { return JSON.parse(localStorage.getItem('datos_entrega')||'{}'); } catch(e){ return {}; } })() || {};
              const payload = Object.assign({}, entregaLocal, { reference: ref, amount_in_cents: amountInCents, currency: WOMPI_CURRENCY, status: 'pending', paid: false });
              const endpoint = PAYMENT_SERVER_URL + '/api/save-registration';
              try{
                if (navigator && navigator.sendBeacon) {
                  const blob = new Blob([JSON.stringify({ payload })], { type: 'application/json' });
                  navigator.sendBeacon(endpoint, blob);
                } else {
                  fetch(endpoint, { method: 'POST', headers: { 'Content-Type':'application/json' }, body: JSON.stringify({ payload }), keepalive: true }).catch(()=>{});
                }
              }catch(e){ try{ fetch(endpoint, { method: 'POST', headers: { 'Content-Type':'application/json' }, body: JSON.stringify({ payload }) }).catch(()=>{}); }catch(_){}
              }
              window.__mm_saved_for_refs = window.__mm_saved_for_refs || {};
              window.__mm_saved_for_refs[ref] = true;
            } catch(e){ console.warn('saveIfNeeded error', e); }
          };
          const mo2 = new MutationObserver((mutations) => {
            for (const m of mutations) {
              if (m.removedNodes && m.removedNodes.length) {
                for (const n of m.removedNodes) {
                  try { if (n.tagName === 'IFRAME' && (n.src||'').includes('wompi')) { saveIfNeeded(); } } catch(e){}
                }
              }
            }
          });
          mo2.observe(document.body, { childList: true, subtree: true });
          window.addEventListener('focus', () => { setTimeout(saveIfNeeded, 250); });

          // Attach click handler to widget button (if present) so we persist
          // registration at the moment the user initiates payment.
          const attachButtonClick = () => {
            try {
              const btn = container.querySelector('button');
              if (btn) {
                btn.addEventListener('click', () => { try { saveIfNeeded(); } catch(e){} }, { once: true });
              }
            } catch (e) { /* ignore */ }
          };
          attachButtonClick();
          const btnObserver = new MutationObserver(() => { attachButtonClick(); });
          btnObserver.observe(container, { childList: true, subtree: true });
        } catch(e) { console.warn('widget save observer failed', e); }
      });
      // Note: fallback to server-created checkout will be invoked only if widget fails to render or user chooses.

    } catch (e) {
      console.error(e);
      container.innerHTML = '<p style="color: #ff6b6b; font-size: 14px;"><b>Error procesando pago</b></p>';
    }
}
