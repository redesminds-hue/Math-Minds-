<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen Final - Math Minds</title>

    <!-- Wompi Checkout -->
    <script src="https://checkout.wompi.co/widget.js"></script>

    <style>
        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: #f4f7f6;
            margin: 0;
        }

        .header {
            background: #fff;
            border-bottom: 2px solid #111;
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header img { height: 60px; }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 30px;
            padding: 0 20px;
        }

        .card {
            background: #fff;
            border: 2px solid #111;
            border-radius: 20px;
            padding: 30px;
        }

        h3 {
            margin-top: 0;
            border-bottom: 2px solid #13d6eba2;
            display: inline-block;
            padding-bottom: 5px;
        }

        .producto {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .total {
            font-size: 22px;
            font-weight: 900;
            text-align: right;
            margin-top: 20px;
        }

        .input {
            width: 100%;
            padding: 14px;
            border: 2px solid #111;
            border-radius: 12px;
            margin-top: 8px;
            font-size: 15px;
        }

        label {
            font-size: 12px;
            font-weight: 700;
        }

        button {
            width: 100%;
            background: #13d6eba2;
            color: #fff;
            border: none;
            padding: 18px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 15px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover { background: #1eb954; }

        @media (max-width: 800px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

<header class="header">
    <img src="../Multimedia/Logo.png" alt="Math Minds">
    <a href="pago.html">← Regresar</a>
</header>

<div class="container">

    <!-- RESUMEN -->
    <div class="card">
        <h3>Resumen del Pedido</h3>
        <div id="productos"></div>
        <div id="total" class="total"></div>
    </div>

    <!-- DATOS -->
    <div class="card">
        <h3>Datos del Estudiante</h3>

        <label>APELLIDO</label>
        <input class="input" id="lastName">

        <label>NOMBRE</label>
        <input class="input" id="firstName">

        <label>GRADO</label>
        <input class="input" id="grade">

        <label>DOCUMENTO</label>
        <input class="input" id="doc">

        <label>CORREO ELECTRÓNICO</label>
        <input class="input" id="email" type="email">

        <button onclick="pagar()">PAGAR</button>
    </div>

</div>

<script>
function init() {
    const carrito = JSON.parse(localStorage.getItem('mm_cart_v1')) || [];
    let total = 0;

    const html = carrito.map(p => {
        const subtotal = p.price * (p.qty || 1);
        total += subtotal;
        return `<div class="producto">
            <span>${p.title} x${p.qty || 1}</span>
            <strong>$${subtotal.toLocaleString()}</strong>
        </div>`;
    }).join('');

    document.getElementById('productos').innerHTML = html || 'Sin productos';
    document.getElementById('total').innerText = `Total: $${total.toLocaleString()}`;

    localStorage.setItem('total_calc', total);
}

function pagar() {
    const last = lastName.value.trim();
    const first = firstName.value.trim();
    const grade = grade.value.trim();
    const doc = doc.value.trim();
    const email = document.getElementById('email').value.trim();

    if (!last || !first || !grade || !doc || !email) {
        alert('Completa todos los datos.');
        return;
    }

    const total = Number(localStorage.getItem('total_calc'));
    const reference = `MM-${Date.now()}-${doc}`;

    const checkout = new WidgetCheckout({
        currency: 'COP',
        amountInCents: total * 100,
        reference: reference,

        // 🔴 CAMBIA ESTA LLAVE
        publicKey: 'pub_test_B3FDnEk0nvEP7EUFzOEoRPl0N8HKGsgK',

        redirectUrl: 'https://angelicagarcia.github.io/Math-Minds-/pago_exitoso.html',

        customerData: {
            email: email,
            fullName: `${first} ${last}`
        }
    });

    checkout.open();
}

init();
</script>

</body>
</html>
