<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Pedido - Math-Minds</title>
    <link rel="stylesheet" href="styles.css"> 
    <style>
        :root {
            --black: #111;
            --purple: #13d6eba2;
            --light-gray: #f8f9fa;
        }

        body {
            background: var(--light-gray);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: 'Poppins', Arial, sans-serif;
            margin: 0;
        }

        /* HEADER OPTIMIZADO: No tapa el contenido */
        .header-checkout {
            width: 100%;
            background: rgba(255, 255, 255, 0.8); /* Más traslúcido */
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding: 8px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 70px; /* Altura fija para control */
            display: flex;
            align-items: center;
        }

        .header-container {
            width: min(1200px, calc(100% - 40px));
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-checkout {
            width: 140px; /* Logo más pequeño como pediste */
            height: auto;
            transition: transform 0.3s ease;
        }
        
        .brand-checkout img {
            width: 100%;
            height: auto;
        }

        .btn-back {
            text-decoration: none;
            color: var(--black);
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            padding: 8px 14px;
            border: 1.5px solid var(--black);
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background: var(--black);
            color: #fff;
        }

        /* FORMULARIO */
        .checkout-main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .checkout-card {
            width: min(650px, 100%);
            background: #fff;
            border: 2px solid var(--black);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }

        .form-title {
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 25px;
            color: var(--black);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .full-width { grid-column: span 2; }

        .form-group label {
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            color: #666;
        }

        .form-group input, .form-group select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            background: #fff;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--purple);
            box-shadow: 0 0 0 3px rgba(19, 214, 235, 0.1);
        }

        .btn-pay {
            width: 100%;
            margin-top: 15px;
            cursor: pointer;
            background: var(--purple);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 15px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .btn-pay:hover {
            background: var(--black);
            transform: translateY(-2px);
        }

        @media (max-width: 740px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .checkout-card { padding: 25px 15px; }
        }
    </style>
</head>
<body>

   <header class="header-checkout">
        <div class="header-container">
            <a href="index.html" class="brand-checkout"><img src="../Multimedia/Logo.png" alt="Math Minds"></a>
            <a href="productos.html" class="btn-back">← Regresar</a>
        </div>
    </header>

    <main class="checkout-main">
        <div class="checkout-card">
            <h2 class="form-title">Datos del Acudiente</h2>
            <form id="payForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nombre Completo</label>
                        <input type="text" id="parentName" required placeholder="Nombre de quien compra">
                    </div>
                    <div class="form-group">
                        <label>Documento (C.C.)</label>
                        <input type="text" id="documentId" required placeholder="C.C.">
                    </div>
                    <div class="form-group full-width">
                        <label>Correo Electrónico</label>
                        <input type="email" id="parentEmail" required placeholder="ejemplo@correo.com">
                    </div>
                    <div class="form-group">
                        <label>Colegio</label>
                        <select id="college" required>
                            <option value="" disabled selected>Selecciona colegio</option>
                            <option value="Colegio 1">Colegio 1</option>
                            <option value="Colegio 2">Colegio 2</option>
                            <option value="Otro">Otro Colegio</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Curso / Grado</label>
                        <select id="grade" required>
                            <option value="" disabled selected>Selecciona grado</option>
                            <option value="Jardin">Jardín</option>
                            <option value="Primero">Primero</option>
                            <option value="Segundo">Segundo</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Ciudad</label>
                        <select id="city" required>
                            <option value="Bogotá">Bogotá D.C.</option>
                            <option value="Nacional">Otras ciudades</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Celular</label>
                        <input type="tel" id="phone" required placeholder="3XXXXXXXXX">
                    </div>
                    <div class="form-group full-width">
                        <label>Dirección y Barrio</label>
                        <input type="text" id="address" required placeholder="Calle 123 # 45-67, Barrio">
                    </div>
                </div>
                <button type="submit" class="btn-pay">CONTINUAR AL ÚLTIMO PASO</button>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('payForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const STORAGE_KEY = 'mm_cart_v1';
            const carrito = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            
            if (carrito.length === 0) {
                alert("⚠️ El carrito está vacío.");
                return;
            }

            const datosEntrega = {
                acudiente: document.getElementById('parentName').value,
                documento: document.getElementById('documentId').value,
                email: document.getElementById('parentEmail').value,
                colegio: document.getElementById('college').value,
                curso: document.getElementById('grade').value,
                ciudad: document.getElementById('city').value,
                direccion: document.getElementById('address').value,
                telefono: document.getElementById('phone').value
            };
            
            localStorage.setItem('datos_entrega', JSON.stringify(datosEntrega));
            window.location.href = 'finalizar_pago.html'; 
        });
    </script>
</body>
</html>
