<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Productos - Math Minds</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <img src="../Multimedia/Logo.png" alt="Math Minds" />
      </div>
      <nav class="menu">
        <a href="index.html">Inicio</a>
        <a class="active" href="#">Productos</a>
        <a href="#" id="cartToggle" class="menu-item cart-link" aria-label="Carrito">🛒 <span id="cartCount" class="cart-badge">0</span></a>
      </nav>
    </div>
  </header>

  <main style="padding:40px; max-width:1200px; margin:0 auto;">
    <h1 id="pageTitle">Productos</h1>
    <p id="pageIntro">Aquí puedes listar todos los productos disponibles. Usa la búsqueda para filtrar resultados.</p>

    <section id="productsGrid" style="margin-top:20px; display:grid; grid-template-columns: repeat(auto-fill,minmax(260px,1fr)); gap:18px;"></section>
  </main>
  <script src="main.js"></script>  <script>
    async function loadAndRender(){
      try{
        const res = await fetch('products.json');
        const products = await res.json();
        const url = new URL(window.location.href);
        const q = (url.searchParams.get('q')||'').trim().toLowerCase();
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = '';

        const filtered = q ? products.filter(p => (p.title.toLowerCase().includes(q) || p.description.toLowerCase().includes(q) || (p.tags||[]).some(t=>t.includes(q)))) : products;

        if (filtered.length === 0){
          grid.innerHTML = '<p style="opacity:.8">No hay productos que coincidan.</p>';
          return;
        }

        filtered.forEach(p => {
          const card = document.createElement('article');
          card.style.border = '2px solid var(--black)';
          card.style.padding = '16px';
          card.style.borderRadius = '12px';
          card.innerHTML = `
            <img src="${p.image}" alt="${p.title}" style="width:100%;height:140px;object-fit:cover;border-radius:8px;margin-bottom:10px;"/>
            <h3 style="margin:0 0 6px 0;">${p.title}</h3>
            <p style="margin:0 0 8px 0;opacity:.85">${p.description}</p>
            <div style="display:flex;gap:8px;align-items:center; margin-top:8px;">
              <a class="btn primary" href="${p.link}" target="_blank">Comprar</a>
              <button class="btn secondary add-to-cart" data-id="${p.id}" data-title="${p.title}" data-price="${p.price || 0}" data-image="${p.image}">Añadir al carrito</button>
            </div>
          `;
          grid.appendChild(card);
        });

      }catch(e){ document.getElementById('productsGrid').innerHTML = '<p>Error cargando productos.</p>'; }
    }
    loadAndRender();

    // Delegated listener for 'Añadir al carrito' buttons
    document.addEventListener('click', function handler(e){
      const btn = e.target && e.target.closest && e.target.closest('.add-to-cart');
      if (!btn) return;
      const id = btn.getAttribute('data-id');
      const title = btn.getAttribute('data-title');
      const price = Number(btn.getAttribute('data-price') || 0);
      const image = btn.getAttribute('data-image');
      if (window.Cart && window.Cart.addItem){
        window.Cart.addItem({ id, title, price, image });
        // open cart to show added items
        window.Cart.open();
      } else {
        alert('Producto agregado al carrito.');
      }
    });
  </script>

  <footer class="footer">
    <div class="footer-inner">
      <div>
        <h3>Contáctanos</h3>
      </div>
    </div>
  </footer>

</body>
</html>
