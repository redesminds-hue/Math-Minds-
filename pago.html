<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Pedido - Math-Minds</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css"> 
    <style>
        :root {
            --black: #111;
            --purple: #13d6eba2;
            --light-gray: #f8f9fa;
        }

        body {
            background: var(--light-gray);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: 'Poppins', Arial, sans-serif;
            margin: 0;
        }

        /* HEADER OPTIMIZADO: No tapa el contenido */
        .header-checkout {
            width: 100%;
            background: rgba(255, 255, 255, 0.8); /* Más traslúcido */
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding: 8px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 70px; /* Altura fija para control */
            display: flex;
            align-items: center;
        }

        .header-container {
            width: min(1200px, calc(100% - 40px));
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-checkout {
            width: 140px; /* Logo más pequeño como pediste */
            height: auto;
            transition: transform 0.3s ease;
        }
        
        .brand-checkout img {
            width: 100%;
            height: auto;
        }

        .btn-back {
            text-decoration: none;
            color: var(--black);
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            padding: 8px 14px;
            border: 1.5px solid var(--black);
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background: var(--black);
            color: #fff;
        }

        /* FORMULARIO */
        .checkout-main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .checkout-card {
            width: min(650px, 100%);
            background: #fff;
            border: 2px solid var(--black);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }

        .form-title {
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 25px;
            color: var(--black);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .full-width { grid-column: span 2; }

        .form-group label {
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            color: #666;
        }

        .form-group input, .form-group select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            background: #fff;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--purple);
            box-shadow: 0 0 0 3px rgba(19, 214, 235, 0.1);
        }

        .btn-pay {
            width: 100%;
            margin-top: 15px;
            cursor: pointer;
            background: var(--purple);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 15px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .btn-pay:hover {
            background: var(--black);
            transform: translateY(-2px);
        }

        @media (max-width: 740px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .checkout-card { padding: 25px 15px; }
        }
    </style>
</head>
<body>

   <header class="header-checkout">
        <div class="header-container">
            <a href="index.html" class="brand-checkout"><img src="../Multimedia/Logo.png" alt="Math Minds"></a>
            <a href="productos.html" class="btn-back">← Regresar</a>
        </div>
    </header>

    <main class="checkout-main">
        <div class="checkout-card">
            <h2 class="form-title">Datos del Acudiente</h2>
            <form id="payForm" autocomplete="off" novalidate>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nombre Completo</label>
                        <input type="text" id="parentName" name="parentName_mm" autocomplete="off" required placeholder="Nombre de quien compra">
                    </div>
                    <div class="form-group">
                        <label>Documento (C.C.)</label>
                        <input type="text" id="documentId" name="documentId_mm" autocomplete="off" required placeholder="C.C.">
                    </div>
                    <div class="form-group full-width">
                        <label>Correo Electrónico</label>
                        <input type="email" id="parentEmail" name="parentEmail_mm" autocomplete="off" required placeholder="ejemplo@correo.com">
                    </div>
                    <div class="form-group">
                        <label>Colegio</label>
                        <select id="college" name="college_mm" autocomplete="off" required>
                            <option value="" disabled selected>Cargando colegios...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Curso / Grado</label>
                        <select id="grade" name="grade_mm" autocomplete="off" required disabled>
                            <option value="" disabled selected>Primero selecciona colegio</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Ciudad</label>
                        <select id="city" name="city_mm" autocomplete="off" required>
                            <option value="Bogotá">Bogotá D.C.</option>
                            <option value="Nacional">Otras ciudades</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Celular</label>
                        <input type="tel" id="phone" name="phone_mm" autocomplete="off" required placeholder="3XXXXXXXXX">
                    </div>
                    <div class="form-group full-width">
                        <label>Dirección y Barrio</label>
                        <input type="text" id="address" name="address_mm" autocomplete="off" required placeholder="Calle 123 # 45-67, Barrio">
                    </div>
                </div>
                <button id="continueBtn" type="button" class="btn-pay">CONTINUAR AL ÚLTIMO PASO</button>
            </form>
        </div>
    </main>

    <script src="main.js"></script>
    <script>
        // Espera hasta que baseDeDatos esté cargada por main.js, luego inicializa selects
        document.addEventListener('DOMContentLoaded', () => {
            const collegeSel = document.getElementById('college');
            const gradeSel = document.getElementById('grade');
            const STORAGE_KEY = 'mm_cart_v1';

            // Clear any stored entrega or frozen references on entry so the form
            // starts empty for every new visitor/session.
            try { localStorage.removeItem('datos_entrega'); localStorage.removeItem('wompi_frozen_reference'); localStorage.removeItem('wompi_frozen_ts'); } catch (e) {}

            function getCartTitles(){
                const cart = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                return cart.map(i => (i.title || '').toString().trim()).filter(Boolean);
            }

            function normalizeText(s){
                return (s||'').toString().trim().toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu, '').replace(/["'`]/g,'').replace(/[^a-z0-9\s]/g,'');
            }

            function productMatches(prodName, cartTitle){
                const a = normalizeText(prodName);
                const b = normalizeText(cartTitle);
                if (!a || !b) return false;
                if (a === b) return true;
                if (a.includes(b) || b.includes(a)) return true;
                // word overlap
                const aw = new Set(a.split(/\s+/));
                const bw = new Set(b.split(/\s+/));
                for (const w of bw){ if (aw.has(w) && w.length > 2) return true; }
                return false;
            }

            function whenBaseReady(cb){
                // If already loaded, call immediately
                if (window.baseDeDatos && window.baseDeDatos.length > 0) return cb();

                // Otherwise listen for the event dispatched by main.js
                const handler = () => { window.removeEventListener('baseDeDatosReady', handler); clearTimeout(timeoutId); cb(); };
                window.addEventListener('baseDeDatosReady', handler);

                // Safety fallback: if event doesn't arrive within 20s, call cb anyway
                const timeoutId = setTimeout(() => {
                    window.removeEventListener('baseDeDatosReady', handler);
                    console.warn('whenBaseReady: timeout waiting for baseDeDatos (fallback)');
                    cb();
                }, 20000);
            }

            function createWarningEl(){
                let el = document.getElementById('collegeWarning');
                if (!el){
                    el = document.createElement('div');
                    el.id = 'collegeWarning';
                    el.style.marginTop = '8px';
                    el.style.color = '#b35f00';
                    el.style.pointerEvents = 'none';
                    el.style.display = 'none';
                    el.style.fontSize = '13px';
                    collegeSel.parentNode.appendChild(el);
                }
                return el;
            }

            function populateCollegeOptions(){
                const cartTitles = getCartTitles();
                const warningEl = createWarningEl();
                console.log('populateCollegeOptions -> cartTitles:', cartTitles);
                // Try window.baseDeDatos first, fallback to localStorage
                let bdb = (window.baseDeDatos || []);
                if ((!bdb || bdb.length === 0) && localStorage.getItem('mm_baseDeDatos')){
                    try{ bdb = JSON.parse(localStorage.getItem('mm_baseDeDatos') || '[]'); }catch(e){ bdb = []; }
                }
                console.log('populateCollegeOptions -> baseDeDatos length:', (bdb||[]).length);
                console.log('populateCollegeOptions -> sample baseDeDatos:', (bdb||[]).slice(0,6));

                // If cart empty, populate all colegios from baseDeDatos
                if (!cartTitles.length){
                    const colegios = [...new Set((window.baseDeDatos || []).map(p => p.colegio))].sort();
                    collegeSel.innerHTML = '<option value="" disabled selected>Selecciona colegio</option>';
                    colegios.forEach(c => collegeSel.add(new Option(c, c)));
                    warningEl.textContent = '';
                    return;
                }

                // Map colegios that contain matches for cart products
                const colegiosMap = new Map();
                // For each cart title, find matching rows in baseDeDatos
                for (const t of cartTitles){
                    const matched = (bdb || []).filter(p => productMatches(p.producto || '', t));
                    matched.forEach(p => {
                        if (!p.colegio) return;
                        if (!colegiosMap.has(p.colegio)) colegiosMap.set(p.colegio, new Set());
                        colegiosMap.get(p.colegio).add(t);
                    });
                }

                collegeSel.innerHTML = '<option value="" disabled selected>Selecciona colegio</option>';
                if (colegiosMap.size === 0){
                    // Ningún colegio tiene los productos exactos; añadir todos los colegios como opción alternativa
                    const colegios = [...new Set((bdb || []).map(p => p.colegio))].sort();
                    colegios.forEach(c => collegeSel.add(new Option(c, c)));
                    collegeSel.disabled = false;
                    warningEl.textContent = '⚠️ Algunos productos en el carrito no están vinculados a colegios en la base de datos.';
                    console.warn('populateCollegeOptions -> colegiosMap empty, fallback colegios:', colegios);
                    return;
                }

                for (const col of Array.from(colegiosMap.keys()).sort()){
                    collegeSel.add(new Option(col, col));
                }
                // Preserve an 'Otro' option
                collegeSel.add(new Option('Otro', 'Otro'));
                collegeSel.disabled = false;
                // If only one colegio available (aside from placeholder), auto-select it
                const optCount = Array.from(collegeSel.options).filter(o => o.value).length; // excludes placeholder
                if (optCount === 1){
                    const only = collegeSel.options[1];
                    if (only) { collegeSel.selectedIndex = 1; collegeSel.dispatchEvent(new Event('change')); }
                }
                warningEl.textContent = '';
            }

            function populateGradesForCollege(col){
                const cartTitles = getCartTitles();
                const warningEl = createWarningEl();
                gradeSel.innerHTML = '<option value="" disabled selected>Selecciona grado</option>';
                warningEl.textContent = '';
                warningEl.style.display = 'none';

                if (!col) return;

                // Use same DB fallback as populateCollegeOptions
                let bdb = (window.baseDeDatos || []);
                if ((!bdb || bdb.length === 0) && localStorage.getItem('mm_baseDeDatos')){
                    try{ bdb = JSON.parse(localStorage.getItem('mm_baseDeDatos') || '[]'); }catch(e){ bdb = []; }
                }

                // For selected colegio, gather grades for cart products
                const gradosSet = new Set();
                for (const t of cartTitles){
                    (bdb || []).forEach(p => {
                        if (p.colegio !== col) return;
                        if (productMatches(p.producto || '', t)) gradosSet.add(p.grado);
                    });
                }

                // If no grades found from cart-products, fallback to all grades in the colegio
                if (gradosSet.size === 0){
                    for (const p of (bdb || [])){
                        if (p.colegio === col) gradosSet.add(p.grado);
                    }
                }

                const grados = Array.from(gradosSet).filter(Boolean).sort();
                grados.forEach(g => gradeSel.add(new Option(g, g)));
                gradeSel.disabled = !(grados.length > 0);

                // Compute unavailable products for this colegio
                const unavailable = getCartTitles().filter(t => {
                    return !(bdb || []).some(p => p.colegio === col && productMatches((p.producto||''), t));
                });

                if (unavailable.length > 0){
                    warningEl.textContent = '⚠️ Algunos productos del carrito no están disponibles para el colegio seleccionado: ' + unavailable.join(', ');
                    warningEl.style.display = 'block';
                } else {
                    warningEl.textContent = '';
                    warningEl.style.display = 'none';
                }
            }

            // Initialize after baseDeDatos ready
            whenBaseReady(() => {
                populateCollegeOptions();
                // Get colegio/grado from the first product in the cart, not from filter selections
                try{
                    const carrito = JSON.parse(localStorage.getItem('mm_cart_v1') || '[]');
                    const pedido = JSON.parse(localStorage.getItem('mm_pedido') || '[]');
                    const cartItems = carrito.length > 0 ? carrito : pedido;
                    
                    let cartColegio = null;
                    let cartGrado = null;
                    
                    if (cartItems.length > 0) {
                        // Extract colegio/grado from first product in cart
                        const firstItem = cartItems[0];
                        cartColegio = firstItem.colegio || null;
                        cartGrado = firstItem.grado || null;
                    }
                    
                    // Do not auto-select colegio/grade from cart or previous choices.
                    // Keep the selects empty so the user fills them intentionally.
                }catch(e){ /* ignore */ }
            });

            collegeSel.addEventListener('change', (e) => {
                populateGradesForCollege(e.target.value);
            });

            // Persist grade selection so finalizar_pago can read it if datos_entrega lacks curso
            const gradeSelEl = document.getElementById('grade');
            if (gradeSelEl){
                gradeSelEl.addEventListener('change', (ev) => {
                    try{ localStorage.setItem('mm_selected_grade', ev.target.value); }catch(e){}
                });
            }

           
                        const SHEET_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbzk6TLMy6MiWqbV0xhpKzVIXl7hmptVraLb6VnXg1VdLTPuOktQiCsJHUtP5RuMSwUb/exec'; // <-- paste your Apps Script URL here
                        // Determine payment server: prefer page origin for same-origin requests; fallback to localhost when opened via file://
                        let PAYMENT_SERVER_URL = 'http://localhost:3000';
                        try{
                            if (typeof window !== 'undefined' && window.location && window.location.protocol && window.location.protocol.startsWith('http')) {
                                PAYMENT_SERVER_URL = window.location.origin;
                            }
                        }catch(e){}

            async function sendToSheet(payload){
                // Prefer sending via local payment server proxy to avoid CORS issues
                const target = (typeof PAYMENT_SERVER_URL !== 'undefined' && PAYMENT_SERVER_URL) ? (PAYMENT_SERVER_URL + '/api/send-to-sheet') : SHEET_WEBHOOK_URL;
                if (!target) return { ok: false, error: 'NO_ENDPOINT' };
                try{
                    const controller = new AbortController();
                    const id = setTimeout(() => controller.abort(), 8000); // 8s timeout
                    // Wrap payload into { action: 'create', payload }
                    const body = JSON.stringify({ action: 'create', payload });
                    const resp = await fetch(target, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body,
                        signal: controller.signal,
                        mode: 'cors'
                    });
                    clearTimeout(id);
                    if (!resp.ok) return { ok: false, status: resp.status };
                    const data = await resp.json().catch(()=>null);
                    return { ok: true, data };
                }catch(err){ return { ok: false, error: err && err.name ? err.name : String(err) }; }
            }

            // Queue pending submissions when offline or endpoint fails
            function queuePendingSubmission(entry){
                try{
                    const key = 'mm_pending_submissions';
                    const arr = JSON.parse(localStorage.getItem(key) || '[]');
                    arr.push({ ts: Date.now(), entry });
                    localStorage.setItem(key, JSON.stringify(arr));
                }catch(e){ console.warn('Failed to queue submission', e); }
            }

            // Try to flush pending submissions (called on load)
            async function flushPending(){
                const key = 'mm_pending_submissions';
                try{
                    const pending = JSON.parse(localStorage.getItem(key) || '[]');
                    if (!pending || !pending.length) return;
                    const remaining = [];
                    for (const item of pending){
                        const r = await sendToSheet(item.entry);
                        if (!r.ok) remaining.push(item);
                    }
                    if (remaining.length) localStorage.setItem(key, JSON.stringify(remaining)); else localStorage.removeItem(key);
                }catch(e){ console.warn('flushPending error', e); }
            }

            // Do NOT auto-flush pending submissions on page load because
            // that can cause old entries to be sent unexpectedly when a user
            // simply opens the form. Instead we clear any stale queue so the
            // form starts empty and only submits when the user explicitly
            // presses CONTINUAR AL ÚLTIMO PASO.
            try { localStorage.removeItem('mm_pending_submissions'); console.log('Cleared mm_pending_submissions on load'); }catch(e){}

            // Prevent Enter key in text inputs from submitting the form (avoid premature reload)
            const payFormEl = document.getElementById('payForm');
            if (payFormEl) {
                payFormEl.addEventListener('keydown', function(ev){
                    try {
                        if (ev.key === 'Enter' && ev.target && ev.target.tagName === 'INPUT') {
                            ev.preventDefault();
                            return false;
                        }
                    } catch (e) { /* ignore */ }
                });
            }

            // Attach click handler to explicit continue button (avoids native form submit)
            const continueBtn = document.getElementById('continueBtn');
            if (continueBtn) {
                continueBtn.addEventListener('click', async function(ev){
                    try { ev.preventDefault(); } catch(e){}
                    try{
                        const carrito = JSON.parse(localStorage.getItem('mm_cart_v1') || '[]');
                        if (!carrito || !carrito.length) { alert('⚠️ El carrito está vacío.'); return; }
                        const datosEntrega = {
                            acudiente: document.getElementById('parentName')?.value || '',
                            documento: document.getElementById('documentId')?.value || '',
                            email: document.getElementById('parentEmail')?.value || '',
                            colegio: document.getElementById('college')?.value || '',
                            curso: document.getElementById('grade')?.value || '',
                            ciudad: document.getElementById('city')?.value || '',
                            direccion: document.getElementById('address')?.value || '',
                            telefono: document.getElementById('phone')?.value || '',
                            carrito: carrito
                        };
                        try{ localStorage.setItem('datos_entrega', JSON.stringify(datosEntrega)); }catch(e){}

                        // Persist registration on the server (non-blocking) so webhook can later forward it to Sheets when payment is confirmed.
                        try{
                            const saveEndpoint = 'http://localhost:3000/api/save-registration';
                            const payload = { payload: datosEntrega };
                            try{
                                if (navigator && navigator.sendBeacon) {
                                    const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
                                    navigator.sendBeacon(saveEndpoint, blob);
                                } else {
                                    // fire-and-forget
                                    setTimeout(()=>{ fetch(saveEndpoint, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(payload), keepalive: true }).catch(()=>{}); }, 0);
                                }
                            }catch(e){ console.warn('save-registration attempt failed', e); }
                        }catch(e){ /* ignore */ }

                        // Navigate immediately to the final step
                        try{ window.location.href = 'finalizar_pago.html'; }catch(e){ try{ window.open('finalizar_pago.html','_self'); }catch(__){} }
                    }catch(err){ console.error('continueBtn handler error', err); try{ window.location.href='finalizar_pago.html'; }catch(e){} }
                });
            }

            // Handle form submit
            document.getElementById('payForm').addEventListener('submit', async function(e){
                console.log('[payForm] submit handler start');
                // Prevent global submit handlers from running (main.js listens on document)
                try{ e.stopPropagation(); }catch(err){ console.warn('[payForm] stopPropagation failed', err); }
                try{ e.stopImmediatePropagation(); }catch(err){ console.warn('[payForm] stopImmediatePropagation failed', err); }
                try{ e.preventDefault(); }catch(err){ console.warn('[payForm] preventDefault failed', err); }
                try{
                const carrito = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                if (carrito.length === 0){ alert('⚠️ El carrito está vacío.'); return; }

                const datosEntrega = {
                    acudiente: document.getElementById('parentName').value,
                    documento: document.getElementById('documentId').value,
                    email: document.getElementById('parentEmail').value,
                    colegio: document.getElementById('college').value,
                    curso: document.getElementById('grade').value,
                    ciudad: document.getElementById('city').value,
                    direccion: document.getElementById('address').value,
                    telefono: document.getElementById('phone').value,
                    carrito: carrito
                };

                // persist locally as before for the app flow
                try{ localStorage.setItem('datos_entrega', JSON.stringify(datosEntrega)); }catch(e){}

                // Persist registration on the server (non-blocking) so webhook can later forward it to Sheets when payment is confirmed.
                try{
                    const saveEndpoint = 'http://localhost:3000/api/save-registration';
                    const payload = { payload: datosEntrega };
                    try{
                        if (navigator && navigator.sendBeacon) {
                            const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
                            navigator.sendBeacon(saveEndpoint, blob);
                        } else {
                            // fire-and-forget
                            setTimeout(()=>{ fetch(saveEndpoint, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(payload), keepalive: true }).catch(()=>{}); }, 0);
                        }
                    }catch(e){ console.warn('save-registration attempt failed', e); }
                }catch(e){ /* ignore */ }

                                // continue to confirmation step regardless
                                try{
                                    console.log('[payForm] redirecting to finalizar_pago.html');
                                    window.location.href = 'finalizar_pago.html';
                                }catch(err){
                                    console.error('[payForm] redirect failed, attempting fallback open', err);
                                    try{ window.open('finalizar_pago.html','_self'); }catch(e){ console.error('Fallback open failed', e); }
                                }
                                console.log('[payForm] submit handler end');
                                return false;
                        }catch(err){
                                console.error('[payForm] unexpected error in submit handler', err);
                                try{ window.location.href = 'finalizar_pago.html'; }catch(e){}
                        }
            });
        });
    </script>
</body>
</html>
