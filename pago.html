<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Pedido - Math-Minds</title>
    <link rel="stylesheet" href="styles.css"> 
    <style>
        :root {
            --black: #111;
            --purple: #13d6eba2;
            --light-gray: #f8f9fa;
        }

        body {
            background: var(--light-gray);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: 'Poppins', Arial, sans-serif;
            margin: 0;
        }

        /* HEADER OPTIMIZADO: No tapa el contenido */
        .header-checkout {
            width: 100%;
            background: rgba(255, 255, 255, 0.8); /* Más traslúcido */
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding: 8px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 70px; /* Altura fija para control */
            display: flex;
            align-items: center;
        }

        .header-container {
            width: min(1200px, calc(100% - 40px));
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-checkout {
            width: 140px; /* Logo más pequeño como pediste */
            height: auto;
            transition: transform 0.3s ease;
        }
        
        .brand-checkout img {
            width: 100%;
            height: auto;
        }

        .btn-back {
            text-decoration: none;
            color: var(--black);
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            padding: 8px 14px;
            border: 1.5px solid var(--black);
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background: var(--black);
            color: #fff;
        }

        /* FORMULARIO */
        .checkout-main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .checkout-card {
            width: min(650px, 100%);
            background: #fff;
            border: 2px solid var(--black);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }

        .form-title {
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 25px;
            color: var(--black);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .full-width { grid-column: span 2; }

        .form-group label {
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            color: #666;
        }

        .form-group input, .form-group select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            background: #fff;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--purple);
            box-shadow: 0 0 0 3px rgba(19, 214, 235, 0.1);
        }

        .btn-pay {
            width: 100%;
            margin-top: 15px;
            cursor: pointer;
            background: var(--purple);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 15px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .btn-pay:hover {
            background: var(--black);
            transform: translateY(-2px);
        }

        @media (max-width: 740px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .checkout-card { padding: 25px 15px; }
        }
    </style>
</head>
<body>

    <header class="header-checkout">
        <div class="header-container">
            <a href="index.html" class="brand-checkout">
                <img src="Multimedia/Logo.png" alt="Math Minds">
            </a>
            <a href="productos.html" class="btn-back">
                ← Regresar
            </a>
        </div>
    </header>

    <main class="checkout-main">
        <div class="checkout-card">
            <h2 class="form-title">Finalizar Pedido</h2>
            <form id="payForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nombre del Acudiente</label>
                        <input type="text" id="parentName" required placeholder="Nombre de quien compra">
                    </div>

                    <div class="form-group">
                        <label>Documento (C.C.)</label>
                        <input type="text" id="documentId" required placeholder="C.C. sin puntos">
                    </div>

                    <div class="form-group">
                        <label>Nombre del Estudiante</label>
                        <input type="text" id="name" required placeholder="Nombre del alumno">
                    </div>

                    <div class="form-group">
                        <label>Grado / Curso</label>
                        <select id="grade" required>
                            <option value="" disabled selected>Selecciona grado</option>
                            <option value="Pre-Jardin">Pre-Jardín</option>
                            <option value="Jardin">Jardín</option>
                            <option value="Transicion">Transición</option>
                            <option value="Primero">Primero</option>
                            <option value="Segundo">Segundo</option>
                            <option value="Tercero">Tercero</option>
                            <option value="Cuarto">Cuarto</option>
                            <option value="Quinto">Quinto</option>
                            <option value="Sexto a Once">Sexto a Once</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Colegio</label>
                        <select id="college" required>
                            <option value="" disabled selected>Selecciona colegio</option>
                            <option value="Colegio 1">Colegio 1</option>
                            <option value="Colegio 2">Colegio 2</option>
                            <option value="Colegio 3">Colegio 3</option>
                            <option value="Colegio 4">Colegio 4</option>
                            <option value="Colegio 5">Colegio 5</option>
                            <option value="Colegio 6">Colegio 6</option>
                            <option value="Colegio 7">Colegio 7</option>
                            <option value="Colegio 8">Colegio 8</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Ciudad de Envío</label>
                        <select id="city" required>
                            <option value="Bogotá">Bogotá D.C.</option>
                            <option value="Chía/Cajicá">Chía / Cajicá / Tabio</option>
                            <option value="Medellín">Medellín</option>
                            <option value="Cali">Cali</option>
                            <option value="Barranquilla">Barranquilla</option>
                            <option value="Bucaramanga">Bucaramanga</option>
                            <option value="Otras Ciudades">Otras Ciudades (Nacional)</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label>Dirección Completa y Barrio</label>
                        <input type="text" id="address" required placeholder="Ej: Calle 123 #45-67, Torre 2 Apto 501">
                    </div>

                    <div class="form-group full-width">
                        <label>Celular WhatsApp</label>
                        <input type="tel" id="phone" required placeholder="3XXXXXXXXX">
                    </div>
                </div>

                <button type="submit" class="btn-pay">Confirmar Pedido</button>
            </form>
        </div>
    </main>

    <footer class="footer" style="padding: 15px 0;">
        <div class="footer-inner" style="justify-content: center;">
            <p style="font-size: 12px; font-weight: 700;">Math-Minds © 2025</p>
        </div>
    </footer>

    <script>
        document.getElementById('payForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const parent = document.getElementById('parentName').value;
            const doc = document.getElementById('documentId').value;
            const student = document.getElementById('name').value;
            const grade = document.getElementById('grade').value;
            const col = document.getElementById('college').value;
            const city = document.getElementById('city').value;
            const addr = document.getElementById('address').value;
            const tel = document.getElementById('phone').value;

            const text = `*NUEVO PEDIDO - MATH MINDS*%0A%0A` +
                         `*ACUDIENTE:* ${parent} (${doc})%0A` +
                         `*ESTUDIANTE:* ${student}%0A` +
                         `*GRADO:* ${grade}%0A` +
                         `*COLEGIO:* ${col}%0A%0A` +
                         `*ENTREGA:* ${city}%0A` +
                         `*DIRECCIÓN:* ${addr}%0A` +
                         `*WHATSAPP:* ${tel}`;
            
            window.open(`https://wa.me/573001234567?text=${text}`, '_blank');
        });
    </script>
</body>
</html>
